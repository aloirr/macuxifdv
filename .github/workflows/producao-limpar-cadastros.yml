name: producao — limpar cadastros de uma empresa

# Modos: simular (contagens por tabela e ROLLBACK) · apagar (backup do banco inteiro antes; cópia das linhas e limpeza numa
# transação; as linhas do lote num arquivo na VM) · restaurar (um lote, só antes do reenvio do ERP) · descartar (apaga a
# cópia do lote e o arquivo).
# Travas: só manual, environment PRODUCAO, só numa tag, fila producao-vm, frase de confirmação no apagar, no restaurar e no
# descartar; psql pelo pgcliente da VM (o runner não tem docker).
# Teste: bash scripts/producao/teste/limpar-cadastros.teste.sh. Regras: cabeçalho de scripts/producao/limpar-cadastros-rotina.sql.

on:
  workflow_dispatch:
    inputs:
      empresa:
        description: código da empresa (ex. AM2808)
        required: true
        default: AM2808
      modo:
        description: simular · apagar · restaurar · descartar
        type: choice
        options: [simular, apagar, restaurar, descartar]
        default: simular
      confirmar:
        description: 'apagar = "APAGAR CADASTROS <empresa>" · restaurar = "RESTAURAR CADASTROS <empresa> <lote>" · descartar = "DESCARTAR COPIA <empresa> <lote>"'
        required: false
        default: ''
      lote:
        description: restaurar e descartar — o lote do apagar (AAAAMMDDTHHMMSSZ)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: producao-vm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  limpar:
    name: limpar cadastros (${{ inputs.modo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: PRODUCAO
    env:
      DC: docker compose --env-file .env --env-file imagens.env --profile ferramentas run --rm -T pgcliente
    steps:
      - name: entradas
        id: entradas
        env:
          EMPRESA: ${{ inputs.empresa }}
          MODO: ${{ inputs.modo }}
          CONFIRMAR: ${{ inputs.confirmar }}
          LOTE: ${{ inputs.lote }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::rode numa tag (o environment PRODUCAO só aceita tag)"; exit 1; }
          [[ "$EMPRESA" =~ ^[a-z0-9][a-z0-9-]{1,39}$ || "$EMPRESA" =~ ^[A-Z]{2}[0-9]{4}$ ]] || { echo "::error::código de empresa inválido"; exit 1; }
          case "$MODO" in
            simular) lote="$(date -u +%Y%m%dT%H%M%SZ)" ;;
            apagar)
              [ "$CONFIRMAR" = "APAGAR CADASTROS $EMPRESA" ] || { echo "::error::no apagar, confirmar = \"APAGAR CADASTROS $EMPRESA\""; exit 1; }
              lote="$(date -u +%Y%m%dT%H%M%SZ)" ;;
            restaurar | descartar)
              [[ "$LOTE" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "::error::informe o lote (AAAAMMDDTHHMMSSZ)"; exit 1; }
              if [ "$MODO" = restaurar ]; then frase="RESTAURAR CADASTROS $EMPRESA $LOTE"; else frase="DESCARTAR COPIA $EMPRESA $LOTE"; fi
              [ "$CONFIRMAR" = "$frase" ] || { echo "::error::confirmar = \"$frase\""; exit 1; }
              lote="$LOTE" ;;
            *) echo "::error::modo inválido"; exit 1 ;;
          esac
          echo "lote=$lote" >> "$GITHUB_OUTPUT"
          echo "### limpar cadastros · $EMPRESA · $MODO · lote $lote" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/producao
          persist-credentials: false

      - name: chave SSH
        id: chave
        uses: ./.github/actions/ssh-prod
        with:
          acao: preparar
          chave: ${{ secrets.PROD_SSH_KEY }}
          host: ${{ secrets.PROD_HOST }}
          conhecidos: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: backup do banco inteiro (antes do apagar)
        if: ${{ inputs.modo == 'apagar' }}
        timeout-minutes: 90
        env:
          USUARIO: ${{ secrets.PROD_USER }}
        run: |
          # o backup diário (db/backup/backup-dbaas.sh: pg_dump, pg_restore -l e envio ao bucket); falhou = não apaga
          set +e
          ssh -l "$USUARIO" prod 'set -eu; cd /opt/macuxi; exec /opt/macuxi/backup/backup-dbaas.sh' 2>&1 | tee backup.txt
          status=${PIPESTATUS[0]}
          set -e
          { echo '```'; tail -n 3 backup.txt; echo '```'; echo "backup do banco: saída $status"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: ${{ inputs.modo }} na VM
        timeout-minutes: 15
        env:
          USUARIO: ${{ secrets.PROD_USER }}
          EMPRESA: ${{ inputs.empresa }}
          MODO: ${{ inputs.modo }}
          LOTE: ${{ steps.entradas.outputs.lote }}
        run: |
          case "$MODO" in
            simular | apagar) roteiro=limpar; args=(-v "empresa=$EMPRESA" -v "modo=$MODO" -v "lote=$LOTE") ;;
            *) roteiro="$MODO"; args=(-v "empresa=$EMPRESA" -v "lote=$LOTE") ;;
          esac
          bash scripts/producao/montar-limpeza.sh "$roteiro" > limpeza.sql
          # SQL pelo stdin; o psql do pgcliente (admin) roda na VM, sem senha no argv nem no log
          remoto="set -eu; cd /opt/macuxi; exec $DC psql -X $(printf '%q ' "${args[@]}") -f -"
          set +e
          ssh -l "$USUARIO" prod "$remoto" < limpeza.sql 2>&1 | tee saida.txt
          status=${PIPESTATUS[0]}
          set -e
          { echo '```'; cat saida.txt; echo '```'; echo "saída: $status (0 ok · 3 erro no SQL ou abortado, nada mudou · 255 falha do SSH)"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: arquivo da cópia na VM
        if: ${{ inputs.modo == 'apagar' || inputs.modo == 'descartar' }}
        timeout-minutes: 10
        env:
          USUARIO: ${{ secrets.PROD_USER }}
          EMPRESA: ${{ inputs.empresa }}
          MODO: ${{ inputs.modo }}
          LOTE: ${{ steps.entradas.outputs.lote }}
        run: |
          # só as linhas do lote (COPY em texto, montar-limpeza.sh arquivo): o descartar apaga de fato a cópia daquele lote
          arquivo="/opt/macuxi/limpeza/$EMPRESA-$LOTE.copy"
          a="$(printf '%q' "$arquivo")"
          if [ "$MODO" = descartar ]; then
            remoto="set -eu; if [ -f $a ]; then rm -f $a; echo 'arquivo removido: $arquivo'; else echo 'arquivo não existia: $arquivo'; fi"
          else
            bash scripts/producao/montar-limpeza.sh arquivo > arquivo.sql
            remoto="set -eu; cd /opt/macuxi; umask 077; mkdir -p limpeza; chmod 700 limpeza;"
            remoto+=" $DC psql -X $(printf '%q ' -v "empresa=$EMPRESA" -v "lote=$LOTE") -f - > $a;"
            remoto+=" n=\$(wc -l < $a); [ \"\$n\" -ge 1 ] || { echo 'arquivo sem linhas' >&2; exit 7; };"
            remoto+=" echo \"arquivo: $arquivo · \$n linhas · \$(stat -c %s $a) bytes\""
          fi
          set +e
          if [ -f arquivo.sql ]; then entrada=arquivo.sql; else entrada=/dev/null; fi
          ssh -l "$USUARIO" prod "$remoto" < "$entrada" 2>&1 | tee dump.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '```'; cat dump.txt; echo '```'
            if [ "$MODO" = apagar ]; then
              linhas="$(sed -n 's/.* · \([0-9]*\) linhas · .*/\1/p' dump.txt)"
              echo "- Restaurar (só antes do reenvio do ERP): modo=restaurar, lote=\`$LOTE\`, confirmar=\`RESTAURAR CADASTROS $EMPRESA $LOTE\`."
              echo "- Sem as linhas do lote em public.macuxi_limpeza_backup, antes do restaurar, na VM (arquivo $arquivo, ${linhas:-?} linhas): \`cd /opt/macuxi && $DC psql -X -v ON_ERROR_STOP=1 -c '\\copy public.macuxi_limpeza_backup from pstdin' < $arquivo\`. Se a tabela tiver sido apagada, recrie-a antes com o \`create table public.macuxi_limpeza_backup\` de scripts/producao/limpar-cadastros-rotina.sql."
              echo "- Descartar 7 dias depois de o reenvio do ERP ser confirmado: modo=descartar, lote=\`$LOTE\`, confirmar=\`DESCARTAR COPIA $EMPRESA $LOTE\`."
            else
              echo "- O backup diário ainda guarda essas linhas por até 30 dias."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: limpar o runner
        if: ${{ always() && steps.chave.outcome != 'skipped' }}
        uses: ./.github/actions/ssh-prod
        with:
          acao: limpar
          arquivos: limpeza.sql arquivo.sql saida.txt dump.txt backup.txt
