name: producao — liberar versão

# Trava do deploy por issue (ADR 0046; R-20261114-121700-alexandre). O repositório privado não tem "Required reviewers":
# o environment PRODUCAO não para (a v1.0.7 subiu sem aprovação). Este workflow confere e PARA na issue de aprovação:
#   1. conferir (sem segredo, só leitura): versão vX.Y.Z nova (a tag ainda não existe), SHA completo, disparo pelo main e
#      a MESMA conferência do producao-publicar.yml (scripts/ci/producao-conferir.mjs): o commit está no main, tem CI
#      verde de push no main e a imagem ghcr.io/<dono>/macuxi-api:<sha> existe no GHCR;
#   2. abrir (issues: write): abre a issue "Aprovar deploy vX.Y.Z" com o rótulo trava-deploy, o SHA, o link deste run e
#      os commits e PRs desde a última tag v* (scripts/ci/producao-trava.mjs abrir). NÃO cria tag nem dispara deploy.
# A aprovação é o comentário "aprovado vX.Y.Z" do Alexandre (conta aloirr, pelo chat e pela ponte) na issue: o
# producao-aprovar.yml confere tudo de novo, cria a tag com o GITHUB_TOKEN, fecha a issue como aprovada e dispara o
# producao-publicar.yml na tag. Para recusar: fechar a issue sem comentar.
# Commit só de .github/docs não monta imagem na demo (scripts/ci/demo-mudou.mjs): antes de liberar um commit desses, rode o
# "demo — publicar" manual no main. Nenhum segredo: só o GITHUB_TOKEN; entradas só por variável de ambiente.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão nova (vX.Y.Z, ex.: v1.0.8); a tag não pode existir'
        required: true
        type: string
      sha:
        description: 'Commit do main a publicar (SHA completo, 40 caracteres)'
        required: true
        type: string

permissions: {}

concurrency:
  group: producao-liberar
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  conferir:
    name: versão nova, commit no main, CI verde e imagem da API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      sha: ${{ steps.alvo.outputs.sha }}
      versao: ${{ steps.alvo.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: versão vX.Y.Z nova e SHA completo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          SHA: ${{ inputs.sha }}
        run: node scripts/ci/producao-conferir.mjs entrada

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: commit no main, CI verde e digest da imagem da API
        id: alvo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          SHA: ${{ inputs.sha }}
          DONO: ${{ github.repository_owner }}
        run: node scripts/ci/producao-conferir.mjs conferir

  abrir:
    name: abre a issue "Aprovar deploy" (não cria tag nem dispara deploy)
    needs: conferir
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: issue de aprovação com os commits e PRs desde a última tag v*
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.conferir.outputs.versao }}
          SHA: ${{ needs.conferir.outputs.sha }}
        run: node scripts/ci/producao-trava.mjs abrir
