name: demo — publicar

# T-0074 (ADR 0020). Publica o ambiente demo/homologação na VM da Magalu Cloud (macuxi-demo-se1):
#   1. imagens: monta apps/api/Dockerfile (API, worker, migrações e seed) e, se existir, apps/web/Dockerfile (BKO) e
#      publica no GHCR (pacotes privados) com o GITHUB_TOKEN, tags <sha> e main;
#   2. deploy (environment DEMO_SSH_KEY): copia scripts/deploy/demo para a VM, roda o preparar-vm.sh (idempotente),
#      grava os segredos vindos do GitHub em /opt/macuxi (modo 600), faz login no GHCR NA VM com o GITHUB_TOKEN deste run,
#      roda o implantar.sh (pull, migrações, seed só no 1º deploy, compose up -d, conferência, remoção das tags
#      macuxi-api/macuxi-bko antigas e docker image prune -f)
#      e sai do GHCR.
# Gatilho: o CI terminar VERDE num push ao main (workflow_run), ou manual (Actions → "demo — publicar" → Run workflow).
# T-0160 item 6 (ADR 0044): no gatilho do CI, só publica se mudou apps/**, modules/**, packages/**, db/** (ou o que monta a
# imagem e o deploy) desde o último deploy verde na VM (scripts/ci/demo-mudou.mjs); o manual sempre publica.
# Nenhum segredo vai para log: os secrets chegam por variável de ambiente e por stdin do ssh, nunca na linha de comando.
# Portal de implantação na demo (T-0091; R-20261107-103434): as chaves da plataforma nascem na VM (preparar-vm.sh); o
# convite do 1º acesso do super-admin vem do secret DEMO_SUPERADMIN_CONVITE (environment DEMO_SSH_KEY, opcional, ≥ 32
# caracteres), gravado no segredos.env como a produção faz com o PROD_SUPERADMIN_CONVITE.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # runs e jobs do próprio demo-publicar (o commit do último deploy verde)
  actions: read

# Uma publicação por vez; a mais nova espera a anterior terminar (nunca dois compose up ao mesmo tempo na VM).
concurrency:
  group: demo-vm
  cancel-in-progress: false

env:
  # commit publicado: o do CI verde (workflow_run) ou o do branch escolhido (manual)
  SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  mudou:
    name: mudou o que vai para a VM?
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publicar: ${{ steps.mudou.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: arquivos desde o último deploy verde
        id: mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/demo-mudou.mjs

  imagens:
    name: imagens no GHCR
    needs: mudou
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.mudou.result == 'success' && needs.mudou.outputs.publicar == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bko: ${{ steps.bko.outputs.existe }}
      dono: ${{ steps.dono.outputs.dono }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: dono do registro (minúsculo)
        id: dono
        env:
          DONO: ${{ github.repository_owner }}
        run: echo "dono=${DONO,,}" >> "$GITHUB_OUTPUT"

      - name: BKO tem Dockerfile?
        id: bko
        run: |
          if [ -f apps/web/Dockerfile ]; then echo "existe=1" >> "$GITHUB_OUTPUT"; else echo "existe=0" >> "$GITHUB_OUTPUT"; echo "::notice::apps/web/Dockerfile ainda não existe: publica só a API"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # T-0154: o build carrega a imagem no Docker do runner (load) e o envio ao GHCR é um passo à parte, com novas
      # tentativas no 403/429/5xx (scripts/deploy/demo/ghcr-tentar.sh: 5 tentativas, 15/30/60/120 s). Erro de build não repete.
      - name: imagem da API e do worker (build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.dono.outputs.dono }}/macuxi-api:${{ env.SHA }}
            ghcr.io/${{ steps.dono.outputs.dono }}/macuxi-api:main
          cache-from: type=gha,scope=macuxi-api
          cache-to: type=gha,scope=macuxi-api,mode=max

      - name: imagem da API e do worker (envio ao GHCR, com novas tentativas)
        env:
          IMG: ghcr.io/${{ steps.dono.outputs.dono }}/macuxi-api
        run: |
          bash scripts/deploy/demo/ghcr-tentar.sh "envio da API ($SHA)" -- docker push "$IMG:$SHA"
          bash scripts/deploy/demo/ghcr-tentar.sh "envio da API (main)" -- docker push "$IMG:main"

      - name: imagem do BKO (build)
        if: ${{ steps.bko.outputs.existe == '1' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.dono.outputs.dono }}/macuxi-bko:${{ env.SHA }}
            ghcr.io/${{ steps.dono.outputs.dono }}/macuxi-bko:main
          cache-from: type=gha,scope=macuxi-bko
          cache-to: type=gha,scope=macuxi-bko,mode=max

      - name: imagem do BKO (envio ao GHCR, com novas tentativas)
        if: ${{ steps.bko.outputs.existe == '1' }}
        env:
          IMG: ghcr.io/${{ steps.dono.outputs.dono }}/macuxi-bko
        run: |
          bash scripts/deploy/demo/ghcr-tentar.sh "envio do BKO ($SHA)" -- docker push "$IMG:$SHA"
          bash scripts/deploy/demo/ghcr-tentar.sh "envio do BKO (main)" -- docker push "$IMG:main"

  deploy:
    name: deploy na VM
    needs: imagens
    # o "mudou" pulado (disparo manual) não pula o deploy: vale o resultado das imagens
    if: ${{ !cancelled() && needs.imagens.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DEMO_SSH_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: scripts/deploy/demo

      - name: chave SSH
        env:
          CHAVE: ${{ secrets.DEMO_SSH_KEY }}
          HOST: ${{ secrets.DEMO_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          # sem CR: chave colada no Windows quebraria o formato OpenSSH
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/demo
          chmod 600 ~/.ssh/demo
          # chave do host na primeira conexão (a VM só aceita a 22 e é nossa); fica só neste runner
          ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host demo\n  HostName %s\n  IdentityFile ~/.ssh/demo\n  IdentitiesOnly yes\n  BatchMode yes\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: copiar scripts e preparar a VM (idempotente)
        env:
          USUARIO: ${{ secrets.DEMO_USER }}
        run: |
          ssh -l "$USUARIO" demo 'rm -rf ~/macuxi-deploy && mkdir -p ~/macuxi-deploy'
          scp -q -o User="$USUARIO" scripts/deploy/demo/* demo:macuxi-deploy/
          ssh -l "$USUARIO" demo 'sudo bash ~/macuxi-deploy/preparar-vm.sh "$USER"'

      - name: segredos do GitHub na VM (modo 600)
        env:
          USUARIO: ${{ secrets.DEMO_USER }}
          S3_ID: ${{ secrets.DEMO_S3_KEY_ID }}
          S3_SEGREDO: ${{ secrets.DEMO_S3_SECRET }}
          TUNEL: ${{ secrets.DEMO_CLOUDFLARE_TUNNEL_TOKEN }}
          # T-0091/ADR 0029: convite do 1º acesso do super-admin (opcional; sem ele o primeiro acesso do portal responde 503)
          SA_CONVITE: ${{ secrets.DEMO_SUPERADMIN_CONVITE }}
          # T-0158: recado automático do diagnóstico (opcional)
          RECADOS_SERVIDOR: ${{ secrets.MACUXI_RECADOS_TOKEN_SERVIDOR }}
        run: |
          {
            printf 'MACUXI_S3_CHAVE_ID=%s\nMACUXI_S3_SEGREDO=%s\n' "$S3_ID" "$S3_SEGREDO"
            if [ -n "$SA_CONVITE" ]; then printf 'MACUXI_SUPERADMIN_CONVITE=%s\n' "$SA_CONVITE"; fi
          } | ssh -l "$USUARIO" demo 'umask 077; cat > /opt/macuxi/segredos.env'
          [ -n "$SA_CONVITE" ] || echo "::notice::sem DEMO_SUPERADMIN_CONVITE: o 1º acesso do portal na demo (config-demo.macuxifdv.com.br) responde 503 até o secret existir"
          printf 'TUNNEL_TOKEN=%s\n' "$TUNEL" \
            | ssh -l "$USUARIO" demo 'umask 077; cat > /opt/macuxi/tunel.env'
          # T-0158 (ADR 0043): token do remetente de sistema `diagnostico` (fine-grained, só no aloirr/macuxifdv-recados,
          # Contents read/write), só no worker (recados.env). Sem o secret, o arquivo fica vazio e o alerta, `desligado`.
          if [ -n "$RECADOS_SERVIDOR" ]; then printf 'MACUXI_RECADOS_TOKEN_SERVIDOR=%s\n' "$RECADOS_SERVIDOR"; fi \
            | ssh -l "$USUARIO" demo 'umask 077; cat > /opt/macuxi/recados.env'
          [ -n "$RECADOS_SERVIDOR" ] || echo "::notice::sem MACUXI_RECADOS_TOKEN_SERVIDOR: os diagnósticos chegam ao portal, mas o recado automático fica desligado"

      - name: publicar (login no GHCR na VM, migrações, compose up, prune)
        env:
          USUARIO: ${{ secrets.DEMO_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
          BKO: ${{ needs.imagens.outputs.bko }}
        run: |
          printf '%s' "$TOKEN" | ssh -l "$USUARIO" demo "docker login ghcr.io -u '$ATOR' --password-stdin >/dev/null"
          opcoes=""
          [ "$BKO" = "1" ] && opcoes="--bko"
          set +e
          ssh -l "$USUARIO" demo "bash ~/macuxi-deploy/implantar.sh '$SHA' $opcoes"
          saida=$?
          ssh -l "$USUARIO" demo 'docker logout ghcr.io >/dev/null 2>&1 || true'
          exit $saida

      - name: conferir pelo domínio
        if: ${{ success() }}
        env:
          BKO: ${{ needs.imagens.outputs.bko }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null https://api-demo.macuxifdv.com.br/v1/saude; then echo "api-demo: ok"; break; fi
            [ "$i" = 20 ] && { echo "::warning::api-demo.macuxifdv.com.br/v1/saude não respondeu (confira o túnel macuxi-demo-nuvem no painel)"; }
            sleep 6
          done
          if [ "$BKO" = "1" ]; then
            curl -fsS -o /dev/null https://bko-demo.macuxifdv.com.br/login && echo "bko-demo: ok" || echo "::warning::bko-demo.macuxifdv.com.br/login não respondeu"
            # T-0091: portal de implantação na demo (rota config-demo. → http://bko:3100 no túnel macuxi-demo-nuvem, criada pelo dono do produto)
            curl -fsS -o /dev/null https://config-demo.macuxifdv.com.br/entrar && echo "config-demo: ok (portal)" || echo "::warning::config-demo.macuxifdv.com.br/entrar não respondeu (rota config-demo. → http://bko:3100 no túnel; portal da T-0087)"
          fi

      - name: limpar a chave do runner
        if: ${{ always() }}
        run: rm -f ~/.ssh/demo ~/.ssh/config
