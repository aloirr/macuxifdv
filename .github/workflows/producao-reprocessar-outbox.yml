name: producao — reprocessar outbox

# Reprocesso ÚNICO dos eventos parados da outbox de UMA empresa (OUTBOX_PARADA; desenho docs/desenho/outbox-parada-v1014.md,
# §7; AM2808: modules/integracao/docs/outbox-parada-am2808-catalogo.md). Só manual e só no environment PRODUCAO.
#
# Autorização: no BKO, o reprocesso de lote de quem não tem `lote.reprocessar` pede a senha de um autorizador (RN-INT-16).
# Aqui não há usuário do BKO: a senha é substituída pela APROVAÇÃO DO ALEXANDRE no environment PRODUCAO (o job não roda sem
# ela) e o registro é o próprio run (quem disparou, quem aprovou, SHA e saída). Rode primeiro com confirmar=false.
#
# O que roda: apps/api/src/cli/reprocessar-outbox.ts, dentro da imagem que está no ar, com o ambiente do serviço worker
# (macuxi_worker + macuxi_app; nunca o admin, nenhum segredo novo). Por dentro é o MESMO despachante do worker
# (Despachante.reprocessarParados → entregar: mesmos consumidores, licença e plataforma.evento_consumo). Nada de SQL à mão.
# - confirmar=false: só leitura; lista os parados (tentativas = 10) da empresa, por evento e classe do erro; transação desfeita.
# - confirmar=true: cada parado é tentado UMA vez, do mais antigo para o mais novo. Publicou → sai da outbox. Falhou → fica
#   parado com tentativas 11 e a classe nova no log; não é tentado outra vez, nem por esta rotina (que só pega tentativas = 10)
#   nem pelo despachante (que só pega < 10). Rodar de novo, portanto, não repete o que já foi tentado.
# - Teto de 100 eventos por empresa (acima disso nada muda, saída 5).
# Log: só contagens, ids técnicos, nomes de evento e classes de erro; nunca payload, mensagem, dado pessoal ou coordenada.
# Depende do deploy da versão com a CLI (v1.0.21): sem ela, para com a saída 9.

on:
  workflow_dispatch:
    inputs:
      empresa:
        description: código da empresa (ex. AM2808)
        required: true
        default: AM2808
      confirmar:
        description: reprocessar de verdade (desmarcado = só a lista, sem mudar nada)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: producao-vm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reprocessar:
    name: reprocessar outbox (${{ inputs.confirmar && 'de verdade' || 'só leitura' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: PRODUCAO
    steps:
      - name: entradas
        env:
          EMPRESA: ${{ inputs.empresa }}
        run: |
          [[ "$EMPRESA" =~ ^[a-z0-9][a-z0-9-]{1,39}$ || "$EMPRESA" =~ ^[A-Z]{2}[0-9]{4}$ ]] || { echo "::error::código de empresa inválido"; exit 1; }

      - name: chave SSH
        env:
          CHAVE: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_HOST }}
          CONHECIDOS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/prod
          chmod 600 ~/.ssh/prod
          if [ -n "$CONHECIDOS" ]; then printf '%s\n' "$CONHECIDOS" | tr -d '\r' > ~/.ssh/known_hosts
          else ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
          printf 'Host prod\n  HostName %s\n  IdentityFile ~/.ssh/prod\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: reprocessar-outbox na VM
        timeout-minutes: 10
        env:
          USUARIO: ${{ secrets.PROD_USER }}
          EMPRESA: ${{ inputs.empresa }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          args=(--empresa "$EMPRESA")
          [ "$CONFIRMAR" = true ] && args+=(--confirmar)
          cli=apps/api/src/cli/reprocessar-outbox.ts
          # contêiner descartável do serviço worker (mesma imagem e mesmo ambiente do despachante no ar), sem dependências
          remoto='set -euo pipefail; cd /opt/macuxi; dc() { docker compose --env-file .env --env-file imagens.env "$@"; };'
          remoto+=" dc run --rm -T --no-deps --entrypoint test worker -f $cli"
          remoto+=' || { echo "a imagem no ar ainda não tem a CLI reprocessar-outbox: faça antes o deploy da v1.0.21" >&2; exit 9; };'
          remoto+=" dc run --rm -T --no-deps worker node --import tsx $cli $(printf '%q ' "${args[@]}")"
          set +e
          ssh -l "$USUARIO" prod "$remoto" 2>&1 | tee saida.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### reprocessar outbox · $EMPRESA ($([ "$CONFIRMAR" = true ] && echo 'de verdade' || echo 'só leitura'))"
            echo '```'
            cat saida.txt
            echo '```'
            echo "saída: $status (0 ok · 1 erro · 2 uso · 3 empresa não encontrada · 5 acima do teto, nada mudou · 9 sem deploy · 255 falha do SSH)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: limpar o runner
        if: ${{ always() }}
        run: rm -f ~/.ssh/prod ~/.ssh/config ~/.ssh/known_hosts saida.txt
