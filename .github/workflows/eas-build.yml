name: eas build

# Build do app no EAS sem o PC do Alexandre. Só manual: Actions → "eas build" → Run workflow.
# Instalado pelo engenheiro-software (dono de .github/**), revisado a partir de apps/mobile/scripts/eas/eas-build.yml
# (engenheiro-apps). Passo a passo: apps/mobile/docs/eas-build-sem-pc.md (copiar o arquivo à mão não é mais preciso).
# Mesmo script do PC (apps/mobile/scripts/eas/build.mjs): perfil do eas.json, nome do build (Campo-Oficial-v1.0.7) e
# EAS_SKIP_AUTO_FINGERPRINT=1. A variante sai do perfil (env APP_VARIANT do eas.json, lida pelo app.config.ts).
# --no-wait: o job só envia o build e termina; o build roda no servidor da Expo. Os links saem no resumo do run.
# so_conferir=true: só confere o EXPO_TOKEN (eas whoami), sem build e sem gastar build do EAS.
# Segredo: EXPO_TOKEN (Settings → Secrets and variables → Actions). Só vai por variável de ambiente, nunca no log.

on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'campo, gestao ou ambas'
        type: choice
        options: [ambas, campo, gestao]
        default: ambas
      perfil:
        description: 'producao (campo-producao/gestao-producao), preview (*-preview) ou desenvolvimento (campo/gestao)'
        type: choice
        options: [producao, preview, desenvolvimento]
        default: producao
      ref:
        description: 'branch, tag ou commit'
        type: string
        default: main
      so_conferir:
        description: 'só conferir o EXPO_TOKEN (eas whoami), sem build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eas-build
  cancel-in-progress: false

jobs:
  build:
    name: eas ${{ inputs.so_conferir && 'whoami' || format('build ({0}, {1})', inputs.variante, inputs.perfil) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: EXPO_TOKEN existe
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN ausente::Crie o secret EXPO_TOKEN em Settings → Secrets and variables → Actions"
            echo '### Token da Expo: ERRO — secret EXPO_TOKEN ausente' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Conferência do token: só o eas-cli (sem checkout nem pnpm install). whoami imprime a conta, nunca o token.
      - name: instalar eas-cli (conferência)
        if: ${{ inputs.so_conferir }}
        run: npm install --global --no-audit --no-fund eas-cli@latest

      - name: eas whoami
        if: ${{ inputs.so_conferir }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          SAIDA="$(eas whoami 2>&1)"
          CODIGO=$?
          set -e
          CONTA="$(printf '%s\n' "$SAIDA" | grep -vE '^\s*$|^★|eas-cli@' | head -n 1)"
          if [ "$CODIGO" -eq 0 ] && [ -n "$CONTA" ]; then
            echo "Token da Expo OK: conta $CONTA"
            echo "### Token da Expo OK: conta $CONTA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$SAIDA"
            {
              echo "### Token da Expo: ERRO (eas whoami saiu com $CODIGO)"
              echo
              echo '```'
              printf '%s\n' "$SAIDA" | head -n 20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: ${{ !inputs.so_conferir }}
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Node 24 (.nvmrc) + pnpm do packageManager + pnpm install --frozen-lockfile (mesma preparação do CI).
      - uses: ./.github/actions/preparar
        if: ${{ !inputs.so_conferir }}

      - uses: expo/expo-github-action@v8
        if: ${{ !inputs.so_conferir }}
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      # 2>&1: a linha "✖ o build ... falhou" e os erros do eas saem no stderr; assim também entram no resumo.
      - name: eas build --no-wait
        if: ${{ !inputs.so_conferir }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VARIANTE: ${{ inputs.variante }}
          PERFIL: ${{ inputs.perfil }}
        run: |
          case "$VARIANTE" in ambas) VARIANTE=ambos ;; campo|gestao) ;; *) echo "::error::variante inválida"; exit 2 ;; esac
          case "$PERFIL" in producao) CANAL=oficial ;; preview) CANAL=demo ;; desenvolvimento) CANAL=dev ;; *) echo "::error::perfil inválido"; exit 2 ;; esac
          set -o pipefail
          node scripts/eas/build.mjs "$VARIANTE" "$CANAL" -- --non-interactive --no-wait 2>&1 | tee "$RUNNER_TEMP/eas.txt"

      - name: links no resumo
        if: ${{ always() && !inputs.so_conferir }}
        run: |
          {
            echo '### Builds enviados ao EAS'
            echo
            grep -E '^▶|✔|✖' "$RUNNER_TEMP/eas.txt" 2>/dev/null | sed 's/^/- /' || true
            echo
            grep -oE 'https://expo\.dev/[^ ]*/builds/[0-9a-f-]+' "$RUNNER_TEMP/eas.txt" 2>/dev/null | sort -u | sed 's/^/- /' || echo '- (nenhum link: veja o log do passo anterior)'
          } >> "$GITHUB_STEP_SUMMARY"
