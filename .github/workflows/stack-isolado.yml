name: stack isolado (demo)

# T-0074 (ADR 0020; decisão do dono do produto no R-20261105-053835, item 2: sem Docker no PC, o stack isolado roda aqui).
# Repete NO RUNNER, com segredos de TESTE gerados no próprio job, o caminho da VM da demo:
#   preparar-vm.sh (2 vezes: idempotente, .env gerado e nunca regenerado, timer macuxi-backup.timer)
#   → imagem da API do commit (apps/api/Dockerfile) num registro LOCAL do runner
#   → implantar.sh (pull, Postgres, migrações e papéis, seed demo com MACUXI_AMBIENTE=demo, up --wait, /v1/saude,
#     sonda do S3, scripts do backup tirados da imagem, conferência das 26 h)
#   → backup pela unidade do systemd (backup-vm.sh: pg_dump → pg_restore -l → serviço backup → bucket)
#   → restaurar-vm.sh ao lado (contagem.sql igual à de antes do backup) → restaurar-vm.sh --trocar → /v1/saude
#   → implantar.sh de novo sobre a base restaurada (sem seed; backup de 0 h).
# Diferenças em relação à VM (scripts/deploy/stack-isolado/compose.ci.yml): Object Storage = S3 falso no compose (SigV4
# conferida), host da Magalu → 127.0.0.1 nos contêineres, cloudflared desligado. Nada acessa a VM nem a Magalu; nenhum
# secret do repositório é usado (permissions: contents: read, sem environment).
# Verde aqui = o backup no deploy (d40267d) pode subir. Como ler o resultado: docs/desenho/T-0074.md, "Stack isolado no CI".

on:
  # manual: só depois que este arquivo estiver no main (regra do GitHub para workflow_dispatch)
  workflow_dispatch:
  # branch de verificação do gerente (lote local, doc 07): roda já no 1º push, antes de o workflow existir no main
  push:
    branches: ['verificacao/**']
    paths:
      - 'scripts/deploy/**'
      - 'db/backup/**'
      - '.github/workflows/stack-isolado.yml'
  pull_request:
    paths:
      - 'scripts/deploy/**'
      - 'db/backup/**'
      - '.github/workflows/stack-isolado.yml'

permissions:
  contents: read

concurrency:
  group: stack-isolado-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash --noprofile --norc -eo pipefail: o "| tee" não esconde falha
    shell: bash

jobs:
  stack:
    name: compose da demo → migrações e seed → backup → restauração → contagem
    # mesma versão da VM macuxi-demo-se1 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.sha }}
      # lidos pelo docker compose em todos os scripts (implantar, backup-vm, restaurar-vm) sem mudar nenhum deles
      MACUXI_IMAGEM_API: localhost:5000/macuxi-api
      COMPOSE_FILE: /opt/macuxi/compose.yml:/opt/macuxi/compose.ci.yml
      SAIDA: /tmp/macuxi-stack
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pré-requisitos do preparar-vm.sh no runner
        run: |
          mkdir -p "$SAIDA"
          sudo apt-get update -q
          # o passo 3 do preparar-vm.sh valida o sshd (sshd -t / sshd -T)
          sudo apt-get install -y -q openssh-server
          # o preparar-vm.sh recusa desligar a senha do SSH sem authorized_keys (proteção da VM): chave DESCARTÁVEL,
          # a privada é apagada na hora (ninguém entra no runner por ela)
          if [ ! -s ~/.ssh/authorized_keys ]; then
            install -d -m 700 ~/.ssh
            ssh-keygen -q -t ed25519 -N '' -C stack-isolado -f "$RUNNER_TEMP/descartavel"
            cat "$RUNNER_TEMP/descartavel.pub" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            rm -f "$RUNNER_TEMP/descartavel" "$RUNNER_TEMP/descartavel.pub"
          fi

      - name: copiar scripts/deploy/demo para ~/macuxi-deploy (igual ao "demo — publicar")
        run: |
          # na VM: ssh 'rm -rf ~/macuxi-deploy && mkdir -p ~/macuxi-deploy' + scp scripts/deploy/demo/* demo:macuxi-deploy/;
          # o preparar-vm.sh e o implantar.sh rodam DE LÁ (o implantar.sh copia o compose.yml ao lado dele para /opt/macuxi)
          rm -rf ~/macuxi-deploy && mkdir -p ~/macuxi-deploy
          cp scripts/deploy/demo/* ~/macuxi-deploy/
          ls -l ~/macuxi-deploy
          test -f ~/macuxi-deploy/compose.yml || { echo "::error::scripts/deploy/demo/compose.yml ausente"; exit 1; }

      - name: preparar-vm.sh (1ª vez)
        run: |
          sudo bash ~/macuxi-deploy/preparar-vm.sh "$(id -un)" 2>&1 | tee "$SAIDA/preparar-1.log"
          # segredos gerados NO RUNNER (openssl rand): mascarados no log, nunca impressos
          while IFS='=' read -r nome valor; do
            case "$nome" in *SENHA|*SEGREDO|*PEPPER) echo "::add-mask::$valor" ;; esac
          done < /opt/macuxi/.env
          test "$(stat -c '%a %U' /opt/macuxi/.env)" = "600 $(id -un)" || { echo "::error::/opt/macuxi/.env sem modo 600 do usuário de deploy"; exit 1; }
          for n in MACUXI_PG_ADMIN_USUARIO MACUXI_PG_ADMIN_SENHA MACUXI_PG_APP_SENHA MACUXI_PG_WORKER_SENHA MACUXI_JWT_SEGREDO MACUXI_HUB_CHAVE_PEPPER; do
            grep -q "^$n=." /opt/macuxi/.env || { echo "::error::preparar-vm.sh não gerou $n"; exit 1; }
          done
          sha256sum /opt/macuxi/.env | cut -d' ' -f1 > "$RUNNER_TEMP/env.sha"

      - name: preparar-vm.sh (2ª vez, idempotente) e timer do backup
        run: |
          sudo bash ~/macuxi-deploy/preparar-vm.sh "$(id -un)" 2>&1 | tee "$SAIDA/preparar-2.log"
          if grep -q '\[preparar-vm\] gerado ' "$SAIDA/preparar-2.log" || [ "$(sha256sum /opt/macuxi/.env | cut -d' ' -f1)" != "$(cat "$RUNNER_TEMP/env.sha")" ]; then
            echo "::error::a 2ª execução do preparar-vm.sh mexeu no /opt/macuxi/.env (deveria só acrescentar o que falta)"; exit 1
          fi
          systemctl is-enabled --quiet macuxi-backup.timer || { echo "::error::macuxi-backup.timer não está habilitado"; exit 1; }
          systemctl is-active --quiet macuxi-backup.timer || { echo "::error::macuxi-backup.timer não está ativo"; exit 1; }
          test "$(stat -c '%a %U' /opt/macuxi/backup)" = "700 $(id -un)" || { echo "::error::/opt/macuxi/backup sem modo 700 do usuário de deploy"; exit 1; }
          systemctl list-timers macuxi-backup.timer --no-pager
          systemctl cat macuxi-backup.service macuxi-backup.timer --no-pager
          # SÓ NO CI: a unidade roda o backup-vm.sh igual à VM, mas com o compose do CI (S3 falso) e a imagem local
          sudo install -d /etc/systemd/system/macuxi-backup.service.d
          printf '[Service]\nEnvironment=COMPOSE_FILE=%s\nEnvironment=MACUXI_IMAGEM_API=%s\n' "$COMPOSE_FILE" "$MACUXI_IMAGEM_API" \
            | sudo tee /etc/systemd/system/macuxi-backup.service.d/ci.conf
          sudo systemctl daemon-reload

      - name: registro local do runner (só 127.0.0.1)
        run: |
          # depois do preparar-vm.sh: o passo 5 dele reinicia o Docker (rotação de log)
          docker run -d --name registro --restart always -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5000/v2/ && break; [ "$i" = 30 ] && exit 1; sleep 1; done

      - uses: docker/setup-buildx-action@v3
        with:
          # o builder alcança o registro em localhost:5000
          driver-opts: network=host

      - name: imagem da API do commit (registro local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: localhost:5000/macuxi-api:${{ github.sha }}
          # lê o cache do "demo — publicar" (só leitura) e grava num escopo próprio
          cache-from: |
            type=gha,scope=macuxi-api
            type=gha,scope=macuxi-api-stack
          cache-to: type=gha,scope=macuxi-api-stack,mode=max

      - name: segredos de TESTE e compose do CI em /opt/macuxi
        run: |
          umask 077
          # o que na VM vem dos secrets DEMO_S3_* e DEMO_CLOUDFLARE_TUNNEL_TOKEN: aqui, valores de teste do próprio job
          segredo="$(openssl rand -hex 32)"
          echo "::add-mask::$segredo"
          printf 'MACUXI_S3_CHAVE_ID=ci-%s\nMACUXI_S3_SEGREDO=%s\n' "$(openssl rand -hex 8)" "$segredo" > /opt/macuxi/segredos.env
          printf 'TUNNEL_TOKEN=ci-sem-tunel\n' > /opt/macuxi/tunel.env
          # o compose.yml da demo: a mesma cópia que o implantar.sh faz no 1º passo dele (install -m 644 "$ORIGEM/compose.yml"),
          # antecipada aqui só para o "config" abaixo validar o modelo combinado (COMPOSE_FILE) antes do deploy
          install -m 644 ~/macuxi-deploy/compose.yml /opt/macuxi/compose.yml
          install -m 644 scripts/deploy/stack-isolado/compose.ci.yml scripts/deploy/stack-isolado/s3-falso.mjs /opt/macuxi/
          cd /opt/macuxi
          # o modelo combinado é válido e NENHUM serviço fala com a Magalu (a saída do config tem os segredos: só o jq lê)
          docker compose --env-file .env --profile ferramentas config --format json > "$RUNNER_TEMP/config.json"
          for s in api worker backup; do
            e="$(jq -r --arg s "$s" '.services[$s].environment.MACUXI_S3_ENDPOINT' "$RUNNER_TEMP/config.json")"
            [ "$e" = "http://s3-falso:9000" ] || { echo "::error::$s com MACUXI_S3_ENDPOINT=$e (esperado o S3 falso)"; exit 1; }
          done
          # fora do modelo (perfil inativo) ou presente só com o perfil ci-sem-tunel, que ninguém liga
          jq -e '(.services.cloudflared // null) == null or ((.services.cloudflared.profiles // []) | index("ci-sem-tunel") != null)' "$RUNNER_TEMP/config.json" > /dev/null \
            || { echo "::error::cloudflared ligado no CI"; exit 1; }
          rm -f "$RUNNER_TEMP/config.json"

      - name: implantar.sh (1º deploy - migrações, seed demo, up, sonda, scripts do backup)
        run: |
          bash ~/macuxi-deploy/implantar.sh "$TAG" 2>&1 | tee "$SAIDA/implantar-1.log"
          l="$SAIDA/implantar-1.log"
          falta() { echo "::error::implantar.sh (1º deploy): $1"; exit 1; }
          grep -q 'primeiro deploy: seed demo' "$l" || falta "não carregou a base de demo"
          grep -q 'api: /v1/saude ok' "$l" || falta "sem /v1/saude"
          grep -q '\[sonda\] armazenamento ok' "$l" || falta "sonda do S3 não passou"
          grep -q 'backup: scripts em /opt/macuxi/backup' "$l" || falta "scripts do backup não saíram da imagem"
          grep -q 'backup: nenhum ainda' "$l" || falta "conferência do backup não disse 'nenhum ainda'"
          ! grep -q '::warning::' "$l" || falta "houve aviso (veja as linhas ::warning:: acima)"
          test "$(stat -c '%a' /opt/macuxi/backup/backup-vm.sh) $(stat -c '%a' /opt/macuxi/backup/restaurar-vm.sh) $(stat -c '%a' /opt/macuxi/backup/contagem.sql)" = "700 700 600" \
            || falta "modos dos scripts do backup (esperado 700 700 600)"

      - name: retrato do banco antes do backup (contagem.sql)
        run: |
          cd /opt/macuxi
          dc() { docker compose --env-file .env --env-file imagens.env "$@"; }
          # api e worker parados: ninguém escreve entre o retrato, o backup e a restauração (comparação EXATA)
          dc stop api worker
          dc exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d macuxi -At -F "|"' < backup/contagem.sql > "$SAIDA/contagem-antes.txt"
          tenants="$(awk -F'|' '$1 == "linhas" && $2 == "plataforma.tenant" {print $3}' "$SAIDA/contagem-antes.txt")"
          linhas="$(awk -F'|' '$1 == "linhas" {s += $3} END {print s + 0}' "$SAIDA/contagem-antes.txt")"
          politicas="$(awk -F'|' '$1 == "politicas" {print $2}' "$SAIDA/contagem-antes.txt")"
          echo "tenants=${tenants:-0} linhas=$linhas politicas=${politicas:-0} tabelas=$(grep -c '^linhas|' "$SAIDA/contagem-antes.txt")"
          [ "${tenants:-0}" -ge 1 ] && [ "${politicas:-0}" -ge 1 ] || { echo "::error::base sem tenant ou sem política de RLS depois do seed"; exit 1; }

      - name: backup pela unidade do systemd (backup-vm.sh → bucket)
        run: |
          sudo systemctl start macuxi-backup.service || true
          sudo journalctl -u macuxi-backup --no-pager -o cat | tee "$SAIDA/backup.log"
          [ "$(systemctl show macuxi-backup.service -p Result --value)" = "success" ] || { echo "::error::macuxi-backup.service falhou"; exit 1; }
          grep -q '\[backup-vm\] .* pronto' "$SAIDA/backup.log" || { echo "::error::backup-vm.sh não chegou ao fim"; exit 1; }
          cd /opt/macuxi
          docker compose --env-file .env --env-file imagens.env --profile ferramentas run --rm -T backup listar | tee "$SAIDA/listar.txt"
          grep -Eq 'backups/macuxi-[0-9]{8}T[0-9]{6}Z\.dump' "$SAIDA/listar.txt" || { echo "::error::nenhum dump em backups/ no bucket"; exit 1; }

      - name: restaurar-vm.sh ao lado e contagem igual à de antes
        run: |
          bash /opt/macuxi/backup/restaurar-vm.sh ultimo 2>&1 | tee "$SAIDA/restaurar-1.log"
          grep -q 'contagem IGUAL' "$SAIDA/restaurar-1.log" || { echo "::error::restaurar-vm.sh: contagem diferente da do banco atual"; exit 1; }
          destino="$(grep -o 'macuxi_restaurado_[0-9]\{14\}' "$SAIDA/restaurar-1.log" | head -n 1)"
          [ -n "$destino" ] || { echo "::error::não achei o banco restaurado no log"; exit 1; }
          cd /opt/macuxi
          docker compose --env-file .env --env-file imagens.env exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1" -At -F "|"' _ "$destino" < backup/contagem.sql > "$SAIDA/contagem-restaurado.txt"
          if ! diff -u "$SAIDA/contagem-antes.txt" "$SAIDA/contagem-restaurado.txt"; then
            echo "::error::contagem.sql do restaurado ($destino) difere do retrato de antes do backup"; exit 1
          fi
          echo "contagem.sql idêntica: $(grep -c '^linhas|' "$SAIDA/contagem-antes.txt") tabelas, políticas, FORCE RLS e privilégios"

      - name: restaurar-vm.sh --trocar e API de volta
        run: |
          bash /opt/macuxi/backup/restaurar-vm.sh ultimo --trocar 2>&1 | tee "$SAIDA/restaurar-2.log"
          grep -q 'contagem IGUAL' "$SAIDA/restaurar-2.log" || { echo "::error::restaurar-vm.sh --trocar: contagem diferente"; exit 1; }
          grep -q 'pronto: macuxi é o restaurado' "$SAIDA/restaurar-2.log" || { echo "::error::restaurar-vm.sh --trocar não trocou o banco"; exit 1; }
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8100/v1/saude && break; [ "$i" = 60 ] && { echo "::error::/v1/saude não voltou depois da troca"; exit 1; }; sleep 2; done
          cd /opt/macuxi
          echo "select datname from pg_database where datname like 'macuxi%' order by 1" \
            | docker compose --env-file .env --env-file imagens.env exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -At' \
            | tee "$SAIDA/bancos.txt"
          grep -Eq '^macuxi_antes_[0-9]{14}$' "$SAIDA/bancos.txt" || { echo "::error::o banco anterior (macuxi_antes_*) não ficou guardado"; exit 1; }

      - name: implantar.sh de novo sobre a base restaurada (sem seed, backup de 0 h)
        run: |
          bash ~/macuxi-deploy/implantar.sh "$TAG" 2>&1 | tee "$SAIDA/implantar-2.log"
          l="$SAIDA/implantar-2.log"
          falta() { echo "::error::implantar.sh (2º deploy): $1"; exit 1; }
          ! grep -q 'primeiro deploy: seed demo' "$l" || falta "recarregou a base de demo (a marca .base-demo-carregada deveria evitar)"
          grep -Eq 'backup: o mais novo tem [0-9]+ h' "$l" || falta "a conferência não achou o backup recém-feito"
          ! grep -q '::warning::' "$l" || falta "houve aviso (veja as linhas ::warning:: acima)"
          grep -q "publicado: $TAG" "$l" || falta "não terminou"

      - name: estado final e logs (sempre)
        if: ${{ always() }}
        run: |
          cd /opt/macuxi 2>/dev/null || exit 0
          [ -f imagens.env ] || exit 0
          dc() { docker compose --env-file .env --env-file imagens.env "$@"; }
          dc ps --all --format 'table {{.Service}}\t{{.Status}}' || true
          # logs da aplicação (pino, sem segredo) e do S3 falso: uma linha por pedido, sem credencial
          for s in api worker postgres s3-falso; do dc logs --no-color --tail 200 "$s" > "$SAIDA/log-$s.txt" 2>&1 || true; done
          tail -n 40 "$SAIDA/log-s3-falso.txt" || true
          {
            echo "### Stack isolado (T-0074)"
            echo "| etapa | log |"
            echo "|---|---|"
            for f in preparar-1 preparar-2 implantar-1 backup restaurar-1 restaurar-2 implantar-2; do
              [ -f "$SAIDA/$f.log" ] && echo "| $f | $(tail -n 1 "$SAIDA/$f.log" | tr '|' '/') |"
            done
            [ -f "$SAIDA/contagem-antes.txt" ] && echo "" && echo "contagem.sql antes do backup: $(grep -c '^linhas|' "$SAIDA/contagem-antes.txt") tabelas, $(awk -F'|' '$1 == "linhas" {s += $3} END {print s + 0}' "$SAIDA/contagem-antes.txt") linhas"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: artefato com os logs e as contagens
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-isolado-${{ github.run_id }}
          path: /tmp/macuxi-stack
          retention-days: 7
          if-no-files-found: ignore

  # T-0086: o compose de PRODUÇÃO (scripts/deploy/producao) no runner, com um Postgres 16 de teste NO LUGAR DO DBaaS:
  # TLS obrigatório (pg_hba só hostssl; certificado do job com SAN do IP do runner → verify-full de verdade) e admin SEM
  # superusuário (LOGIN CREATEDB CREATEROLE, membro de pg_read_all_data/pg_write_all_data: o do DBaaS medido no P3; o
  # mesmo do db/scripts/admin-sem-superusuario.ts). Caminho: preparar-vm.sh (2x, timers do backup e do alerta, faixas do
  # Docker) → implantar.sh (banco-dbaas.sh: banco, vector, papéis B0, migrações com o macuxi_manutencao, conferir-rls)
  # → conexões da API/worker cifradas → 2º deploy (idempotente) → imagem quebrada → VOLTA ATRÁS (código 3) → alerta pelo
  # timer → tenant:criar (T-0083) → backup de produção, se o script do banco-dados já estiver na imagem.
  stack-producao:
    name: compose de produção → DBaaS de teste (TLS, sem superusuário) → volta atrás → alerta → tenant
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: /opt/macuxi/compose.yml:/opt/macuxi/compose.ci.yml
      SAIDA: /tmp/macuxi-stack-prod
      # o "DBaaS" é o próprio runner (rota pela lo): só aqui a conferência da rota fica desligada
      MACUXI_CONFERIR_ROTA: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pré-requisitos do preparar-vm.sh no runner
        run: |
          mkdir -p "$SAIDA"
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          if [ ! -s ~/.ssh/authorized_keys ]; then
            install -d -m 700 ~/.ssh
            ssh-keygen -q -t ed25519 -N '' -C stack-producao -f "$RUNNER_TEMP/descartavel"
            cat "$RUNNER_TEMP/descartavel.pub" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            rm -f "$RUNNER_TEMP/descartavel" "$RUNNER_TEMP/descartavel.pub"
          fi

      - name: copiar scripts/deploy/producao + alerta-saude.sh (igual ao "producao — publicar")
        run: |
          rm -rf ~/macuxi-deploy && mkdir -p ~/macuxi-deploy
          cp scripts/deploy/producao/* scripts/deploy/demo/alerta-saude.sh ~/macuxi-deploy/
          ls -l ~/macuxi-deploy

      - name: preparar-vm.sh (2 vezes) — .env, timers e faixas do Docker
        run: |
          sudo bash ~/macuxi-deploy/preparar-vm.sh "$(id -un)" 2>&1 | tee "$SAIDA/preparar-1.log"
          while IFS='=' read -r nome valor; do
            case "$nome" in *SENHA|*SEGREDO|*PEPPER) echo "::add-mask::$valor" ;; esac
          done < /opt/macuxi/.env
          for n in MACUXI_PG_APP_SENHA MACUXI_PG_WORKER_SENHA MACUXI_JWT_SEGREDO MACUXI_HUB_CHAVE_PEPPER; do
            grep -q "^$n=." /opt/macuxi/.env || { echo "::error::preparar-vm.sh não gerou $n"; exit 1; }
          done
          if grep -q '^MACUXI_PG_ADMIN' /opt/macuxi/.env; then echo "::error::a senha do admin não pode nascer no .env da produção"; exit 1; fi
          antes="$(sha256sum /opt/macuxi/.env)"
          sudo bash ~/macuxi-deploy/preparar-vm.sh "$(id -un)" 2>&1 | tee "$SAIDA/preparar-2.log"
          [ "$antes" = "$(sha256sum /opt/macuxi/.env)" ] || { echo "::error::a 2ª execução mexeu no .env"; exit 1; }
          for t in macuxi-backup.timer macuxi-alerta.timer; do
            if ! systemctl is-enabled --quiet "$t" || ! systemctl is-active --quiet "$t"; then echo "::error::$t não está habilitado e ativo"; exit 1; fi
          done
          test -x /opt/macuxi/alerta-saude.sh || { echo "::error::alerta-saude.sh não instalado pelo preparar-vm.sh"; exit 1; }
          systemctl list-timers macuxi-backup.timer macuxi-alerta.timer --no-pager
          jq -e '."default-address-pools"[0].base == "192.168.200.0/21"' /etc/docker/daemon.json > /dev/null || { echo "::error::faixas do Docker não aplicadas"; exit 1; }

      - name: Postgres 16 de teste no lugar do DBaaS (TLS obrigatório, admin sem superusuário)
        run: |
          IP="$(hostname -I | awk '{print $1}')"
          echo "DBAAS_IP=$IP" >> "$GITHUB_ENV"
          d="$RUNNER_TEMP/dbaas"; mkdir -p "$d"
          # CA e certificado do servidor com SAN do IP (verify-full de verdade, como com a CA da Magalu)
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=macuxi-ci-ca' -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=$IP" -keyout "$d/server.key" -out "$d/server.csr" 2>/dev/null
          printf 'subjectAltName=IP:%s\n' "$IP" > "$d/san.ext"
          openssl x509 -req -in "$d/server.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" -CAcreateserial -days 2 -extfile "$d/san.ext" -out "$d/server.crt" 2>/dev/null
          printf 'local all all trust\nhostssl all all all scram-sha-256\n' > "$d/pg_hba.conf"
          chmod 644 "$d"/*
          super="$(openssl rand -hex 24)"; echo "::add-mask::$super"
          admin="$(openssl rand -hex 24)"; echo "::add-mask::$admin"
          echo "ADMIN_SENHA=$admin" >> "$GITHUB_ENV"
          docker run -d --name dbaas-falso --restart always -p "$IP:5432:5432" \
            -e POSTGRES_PASSWORD="$super" -e TZ=UTC -v "$d:/certs-src:ro" --entrypoint bash pgvector/pgvector:pg16 \
            -c 'install -o postgres -g postgres -m 600 /certs-src/server.key /var/lib/postgresql/server.key && install -o postgres -g postgres -m 644 /certs-src/server.crt /certs-src/pg_hba.conf /var/lib/postgresql/ && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key -c hba_file=/var/lib/postgresql/pg_hba.conf -c timezone=UTC'
          for i in $(seq 1 60); do
            if docker exec dbaas-falso psql -U postgres -d postgres -Atc 'select 1' > /dev/null 2>&1 && docker exec dbaas-falso pg_isready -h 127.0.0.1 -U postgres > /dev/null 2>&1; then break; fi
            [ "$i" = 60 ] && { docker logs dbaas-falso; exit 1; }
            sleep 2
          done
          sleep 3
          # como o DBaaS: vector já disponível (no DBaaS, pelo pgextwlist; aqui, no template1) e um admin sem SUPERUSER/BYPASSRLS
          docker exec -i dbaas-falso psql -v ON_ERROR_STOP=1 -U postgres -d template1 -c 'create extension if not exists vector' > /dev/null
          printf "create role macuxi_admin_sem_super login createdb createrole nosuperuser nobypassrls noreplication password '%s';\ngrant pg_read_all_data, pg_write_all_data to macuxi_admin_sem_super;\n" "$admin" \
            | docker exec -i dbaas-falso psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres
          install -m 644 "$d/ca.pem" /opt/macuxi/certs/dbaas-ca.pem
          rm -f "$d/ca.key"

      - name: registro local (só 127.0.0.1)
        run: |
          docker run -d --name registro --restart always -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5000/v2/ && break; [ "$i" = 30 ] && exit 1; sleep 1; done

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: imagem da API do commit (registro local)
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: localhost:5000/macuxi-api:${{ github.sha }}
          cache-from: |
            type=gha,scope=macuxi-api
            type=gha,scope=macuxi-api-stack
          cache-to: type=gha,scope=macuxi-api-stack,mode=max

      - name: segredos de TESTE (nos arquivos que o workflow grava) e compose do CI
        env:
          DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::digest da imagem inválido"; exit 1; }
          echo "API_REF=localhost:5000/macuxi-api@$DIGEST" >> "$GITHUB_ENV"
          umask 077
          s3="$(openssl rand -hex 32)"; echo "::add-mask::$s3"
          printf 'MACUXI_PG_HOST=%s\nMACUXI_PG_PORTA=5432\n' "$DBAAS_IP" > /opt/macuxi/banco.env
          printf 'MACUXI_PG_ADMIN_USUARIO=macuxi_admin_sem_super\nMACUXI_PG_ADMIN_SENHA=%s\n' "$ADMIN_SENHA" > /opt/macuxi/admin.env
          printf 'MACUXI_S3_CHAVE_ID=ci-%s\nMACUXI_S3_SEGREDO=%s\n' "$(openssl rand -hex 8)" "$s3" > /opt/macuxi/segredos.env
          printf 'TUNNEL_TOKEN=ci-sem-tunel\n' > /opt/macuxi/tunel.env
          install -m 644 scripts/deploy/stack-isolado/compose.producao.ci.yml /opt/macuxi/compose.ci.yml
          install -m 644 scripts/deploy/stack-isolado/s3-falso.mjs /opt/macuxi/

      - name: implantar.sh (1º deploy — banco do zero no "DBaaS")
        run: |
          bash ~/macuxi-deploy/implantar.sh --api "$API_REF" --versao v0.0.0-ci1 2>&1 | tee "$SAIDA/implantar-1.log"
          l="$SAIDA/implantar-1.log"
          falta() { echo "::error::1º deploy: $1"; exit 1; }
          grep -q 'banco macuxi criado (primeiro deploy)' "$l" || falta "não criou o banco"
          grep -q 'certificado conferido' "$l" || falta "TLS sem verify-full (a CA do job estava em certs/)"
          grep -q 'admin sem SUPERUSER e sem BYPASSRLS' "$l" || falta "o admin do teste não é o do DBaaS"
          grep -Eq 'extensão vector 0\.[89]' "$l" || falta "sem a extensão vector >= 0.8"
          grep -q 'papéis: macuxi_app e macuxi_worker com LOGIN' "$l" || falta "papéis"
          grep -q 'admin herda o macuxi_manutencao' "$l" || falta "0031"
          grep -q 'conferir-rls.sql = 0' "$l" || falta "conferir-rls.sql"
          grep -q 'api: /v1/saude ok (banco ok, versão v0.0.0-ci1)' "$l" || falta "saúde"
          grep -q '\[sonda\] armazenamento ok' "$l" || falta "sonda do S3"
          grep -q 'publicado: v0.0.0-ci1' "$l" || falta "não terminou"

      - name: API e worker conectados ao "DBaaS" só com TLS; rede fora da faixa da VPC
        run: |
          docker exec dbaas-falso psql -U postgres -d postgres -At -F '|' -c \
            "select a.usename, s.ssl, count(*) from pg_stat_activity a join pg_stat_ssl s using (pid) where a.usename in ('macuxi_app','macuxi_worker') group by 1, 2 order by 1, 2" \
            | tee "$SAIDA/conexoes.txt"
          grep -q '^macuxi_app|t|' "$SAIDA/conexoes.txt" && grep -q '^macuxi_worker|t|' "$SAIDA/conexoes.txt" || { echo "::error::api/worker sem conexão cifrada"; exit 1; }
          if grep -q '|f|' "$SAIDA/conexoes.txt"; then echo "::error::conexão SEM TLS"; exit 1; fi
          docker network inspect macuxi-prod_macuxi --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' | tee "$SAIDA/rede.txt"
          grep -Eq '^192\.168\.(20[0-7])\.' "$SAIDA/rede.txt" || { echo "::error::a rede do compose não saiu da faixa 192.168.200.0/21"; exit 1; }

      - name: implantar.sh (2º deploy — idempotente)
        run: |
          bash ~/macuxi-deploy/implantar.sh --api "$API_REF" --versao v0.0.0-ci2 2>&1 | tee "$SAIDA/implantar-2.log"
          grep -q 'banco macuxi já existe' "$SAIDA/implantar-2.log" || { echo "::error::2º deploy recriou o banco?"; exit 1; }
          grep -q 'up em macuxi: nada pendente' "$SAIDA/implantar-2.log" || { echo "::error::2º deploy aplicou migração"; exit 1; }
          grep -q 'publicado: v0.0.0-ci2' "$SAIDA/implantar-2.log" || { echo "::error::2º deploy não terminou"; exit 1; }

      - name: imagem quebrada → volta atrás sozinho (código 3)
        run: |
          printf 'FROM %s\nCMD ["node", "-e", "process.exit(1)"]\n' "$API_REF" | docker build -q -t localhost:5000/macuxi-api:quebrada - > /dev/null
          docker push -q localhost:5000/macuxi-api:quebrada > /dev/null
          ruim="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/macuxi-api:quebrada)"
          set +e
          bash ~/macuxi-deploy/implantar.sh --api "$ruim" --versao v0.0.0-ci3 2>&1 | tee "$SAIDA/implantar-3.log"
          codigo=${PIPESTATUS[0]}
          set -e
          [ "$codigo" = 3 ] || { echo "::error::esperado código 3 (voltou atrás), veio $codigo"; exit 1; }
          grep -q 'produção de volta em v0.0.0-ci2' "$SAIDA/implantar-3.log" || { echo "::error::não voltou para a v0.0.0-ci2"; exit 1; }
          curl -fsS http://127.0.0.1:8100/v1/saude | grep -q '"versao":"v0.0.0-ci2"' || { echo "::error::a API no ar não é a v0.0.0-ci2"; exit 1; }
          grep -q '^MACUXI_VERSAO=v0.0.0-ci2$' /opt/macuxi/imagens.env || { echo "::error::imagens.env não voltou"; exit 1; }

      - name: alerta de saúde pelo timer do systemd
        run: |
          sudo systemctl start macuxi-alerta.service
          sleep 2
          sudo journalctl -t macuxi-alerta --no-pager -o cat | tee "$SAIDA/alerta.log"
          grep -q '^Macuxi producao: .* -> ok ' "$SAIDA/alerta.log" || { echo "::error::o alerta (macuxi-alerta.service) não registrou o estado ok"; exit 1; }
          [ "$(systemctl show macuxi-alerta.service -p Result --value)" = success ] || { echo "::error::macuxi-alerta.service falhou"; exit 1; }

      - name: tenant:criar (T-0083) contra o "DBaaS"
        run: |
          cd /opt/macuxi
          MACUXI_TENANT_ADMIN_SENHA="Ci-$(openssl rand -hex 12)"
          echo "::add-mask::$MACUXI_TENANT_ADMIN_SENHA"
          export MACUXI_TENANT_ADMIN_SENHA
          docker compose --env-file .env --env-file imagens.env --profile ferramentas run --rm -T -e MACUXI_TENANT_ADMIN_SENHA tenant \
            criar --codigo teste-ci --nome "Tenant de teste do CI" --modulos core,catalogo,vendedor,promotor \
            --admin-email admin@teste-ci.invalid --admin-nome "Admin CI" --confirmar teste-ci 2>&1 | tee "$SAIDA/tenant.log"
          grep -q '"resultado":"criado"' "$SAIDA/tenant.log" || { echo "::error::tenant:criar não criou o tenant"; exit 1; }

      - name: backup de produção (se o script do banco-dados já estiver na imagem)
        run: |
          if [ ! -x /opt/macuxi/backup/backup-dbaas.sh ]; then
            echo "::notice::db/backup/backup-dbaas.sh ainda não está na imagem (banco-dados, T-0086): backup de produção não ensaiado aqui"
            exit 0
          fi
          sudo install -d /etc/systemd/system/macuxi-backup.service.d
          printf '[Service]\nEnvironment=COMPOSE_FILE=%s\nEnvironment=MACUXI_CONFERIR_ROTA=0\n' "$COMPOSE_FILE" | sudo tee /etc/systemd/system/macuxi-backup.service.d/ci.conf
          sudo systemctl daemon-reload
          sudo systemctl start macuxi-backup.service || true
          sudo journalctl -u macuxi-backup --no-pager -o cat | tee "$SAIDA/backup.log"
          [ "$(systemctl show macuxi-backup.service -p Result --value)" = success ] || { echo "::error::macuxi-backup.service falhou"; exit 1; }
          cd /opt/macuxi
          docker compose --env-file .env --env-file imagens.env --profile ferramentas run --rm -T backup listar | tee "$SAIDA/listar.txt"
          grep -Eq 'backups/macuxi-[0-9]{8}T[0-9]{6}Z\.dump' "$SAIDA/listar.txt" || { echo "::error::nenhum dump em backups/"; exit 1; }
          if [ -x /opt/macuxi/backup/ensaio-restauracao.sh ]; then
            /opt/macuxi/backup/ensaio-restauracao.sh ultimo 2>&1 | tee "$SAIDA/ensaio.log"
            grep -q '^\[ensaio\] resultado: IGUAL' "$SAIDA/ensaio.log" || { echo "::error::ensaio de restauração sem 'resultado: IGUAL'"; exit 1; }
          fi

      - name: estado final e logs (sempre)
        if: ${{ always() }}
        run: |
          cd /opt/macuxi 2>/dev/null || exit 0
          [ -f imagens.env ] || exit 0
          dc() { docker compose --env-file .env --env-file imagens.env "$@"; }
          dc ps --all --format 'table {{.Service}}\t{{.Status}}' || true
          for s in api worker s3-falso; do dc logs --no-color --tail 200 "$s" > "$SAIDA/log-$s.txt" 2>&1 || true; done
          docker logs --tail 200 dbaas-falso > "$SAIDA/log-dbaas-falso.txt" 2>&1 || true
          {
            echo "### Stack isolado — produção (T-0086)"
            echo "| etapa | última linha |"
            echo "|---|---|"
            for f in preparar-1 preparar-2 implantar-1 implantar-2 implantar-3 alerta tenant backup ensaio; do
              [ -f "$SAIDA/$f.log" ] && echo "| $f | $(tail -n 1 "$SAIDA/$f.log" | tr '|' '/') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: artefato com os logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-producao-${{ github.run_id }}
          path: /tmp/macuxi-stack-prod
          retention-days: 7
          if-no-files-found: ignore
