name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint, fronteiras, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint inclui `pnpm fronteiras` (dependency-cruiser): módulo só importa packages/*,
      # modules/core/contracts e modules/<outro>/contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
