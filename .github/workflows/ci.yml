name: CI

# T-0005 → T-0033 (ADR 0014) → T-0160 (ADR 0044: −70% de minutos do Actions, o mesmo nível de verificação antes do main)
# → R-20261114-221000-alexandre (CI de ~13 para 8–10 min de relógio: governança em paralelo, shards e estático em 2 partes)
# → R-20261115-213600-alexandre (custo do Actions; a regra está no cabeçalho do scripts/ci/escopo.mjs)
# → R-20261120-073449-alexandre (suíte completa uma vez por versão: PR e push ao main só com o CI leve; as suítes rodam no
#   manual e na chamada do producao-liberar.yml, no SHA da versão).
# 5 jobs + o ci-ok (antes 12), 3 deles em matriz: cada job/shard paga a preparação (checkout + pnpm install) e o minuto
# arredondado para cima, em troca de relógio. Sem fail-fast; dentro de cada job todos os passos rodam mesmo depois de uma
# falha (R-20261101-014652).
#   escopo              ~30 s, sem pnpm install: economia (um rerun só) e DECIDE o escopo (scripts/ci/escopo.mjs). É o
#                       único job de que os testes dependem (needs: escopo):
#                         documentacao  → só .coord/**, docs/** e *.md da raiz (menos a docs/modulos/, que o código lê):
#                                         só escopo, governança e ci-ok (a guarda R4 prova que nenhum código lê documentação);
#                         reaproveitado → push ao main de uma árvore que já passou verde com os testes (manual): idem;
#                         codigo        → pacotes AFETADOS (alterados + dependentes) em PR, push e ensaio; TODOS no
#                                         manual com "completo" ou com "sha" e na chamada do producao-liberar.
#   governanca          EM PARALELO (sem needs): coord, guardiões, guardas de scripts/ci, donos do PR / por commit, brechas
#                       do guardião v5 (T-0049), guardião ligado, agente do branch da nuvem e economia do Actions (ADR 0045).
#                       No push, calcula a base sozinha (o mesmo escopo.mjs, segundos) para os donos por commit e o trailer.
#   estatico            matriz parte: verificar (lint, fronteiras, timers, typecheck) | build (se web ou mobile foram
#                       afetados: build do BKO e bundle do app, com cache do .next e do Metro; senão termina em segundos)
#   testes-pacotes      só no manual e no liberar. Matriz shard 1..3 (scripts/ci/shards.mjs, divisão por peso dos pacotes
#                       afetados): testes (Postgres) e, no shard que recebe o item, a suíte do @macuxi/db com admin sem
#                       superusuário (simula o DBaaS, T-0075) num segundo Postgres do mesmo job
#   testes-integracao   só no manual e no liberar. Matriz shard 1..3 (vitest --shard): tests/ inteiro (Postgres) sempre
#                       que há código
#   ci-ok               agrega: é o check a olhar. Verde com as suítes, grava o artefato ci-verde-<matriz>-<árvore>.
# Cache do Turborepo (.turbo/cache): no PR lê o do main; fora do PR (push, manual, liberar) não lê (TURBO_FORCE) e grava.

on:
  # PR em rascunho não roda (os jobs escopo e governanca pulam e o resto vai junto); ao sair do rascunho
  # (ready_for_review), roda.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # CI leve, o mesmo do PR (R-20261120-073449-alexandre): sem as suítes, que antes rodavam a cada merge (~15 min).
  push:
    branches: [main]
  # Manual: o ensaio do branch verificacao/* (doc 07; pacotes afetados desde o merge-base com o main, "completo" = todos)
  # ou a suíte de um commit do main antes do liberar ("sha": todos os pacotes nesse commit).
  workflow_dispatch:
    inputs:
      completo:
        description: 'Todos os pacotes (sem marcar: só os afetados desde o main)'
        type: boolean
        default: false
      sha:
        description: 'Commit a testar (SHA completo; vazio = o do branch escolhido). Com SHA, todos os pacotes'
        type: string
        default: ''
  # Chamado pelo producao-liberar.yml: a suíte completa no SHA da versão, antes da imagem e da issue de aprovação. Aqui o
  # evento é o do liberar (workflow_dispatch) e não passa segredo nenhum.
  workflow_call:
    inputs:
      sha:
        description: 'Commit da versão (SHA completo)'
        type: string
        required: true

permissions:
  contents: read
  # API do Actions: último push verde do main (base do escopo) e o artefato ci-verde-* (reaproveitar a mesma árvore)
  actions: read

# Um grupo por workflow que dispara (o CI ou o liberar, na chamada) e por PR / por evento + branch: o run novo CANCELA o
# antigo em todo evento, e o disparo manual no main não cancela a suíte do liberar. No push ao main, a base do escopo e da
# verificação de donos é o último push VERDE do main (escopo.mjs), então o push cancelado não deixa commit sem verificação.
# Sem paths/paths-ignore no gatilho: o ci-ok é check obrigatório e ficaria pendente; o escopo documentacao já roda só a
# governança e o ci-ok.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

env:
  # Teste de banco FALHA (em vez de pular) se o Postgres não responder. O turbo.json repassa MACUXI_PG_*.
  MACUXI_PG_EXIGIR: '1'
  # O Postgres do CI é o service container: nunca tentar subir o docker compose no runner.
  MACUXI_PG_AUTO_SUBIR: '0'
  MACUXI_PG_HOST: localhost
  MACUXI_PG_PORTA: '5432'
  MACUXI_PG_ADMIN_USUARIO: postgres
  MACUXI_PG_ADMIN_SENHA: postgres
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CACHE_DIR: .turbo/cache
  # PR: lê o cache. Push, manual e liberar: não lê (só grava) — fora do PR o que foi selecionado sempre roda.
  TURBO_FORCE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

jobs:
  escopo:
    name: escopo (economia e pacotes afetados)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      escopo: ${{ steps.escopo.outputs.escopo }}
      matriz: ${{ steps.escopo.outputs.matriz }}
      arvore: ${{ steps.escopo.outputs.arvore }}
      jobs: ${{ steps.escopo.outputs.jobs }}
      filtro_lint: ${{ steps.escopo.outputs.filtro_lint }}
      filtro_typecheck: ${{ steps.escopo.outputs.filtro_typecheck }}
      filtro_test: ${{ steps.escopo.outputs.filtro_test }}
      build: ${{ steps.escopo.outputs.build }}
      db_sem_super: ${{ steps.escopo.outputs.db_sem_super }}
    steps:
      # Histórico completo: o escopo precisa de origin/main, do merge-base e da base do push. ref: o "sha" do manual ou do
      # liberar (vazio = o commit do evento), em todos os jobs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      # Sem pnpm install: tudo aqui é node puro (sem dependência).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ADR 0045: um rerun só, para infraestrutura (137, runner desligado). Na 3ª tentativa fica vermelho ANTES do escopo:
      # o escopo pula (sem if), os outros jobs não rodam e o ci-ok acusa. Segundos, no job que já existe.
      - name: economia — um rerun só
        run: node scripts/ci/economia-actions.mjs tentativa

      # PRIMEIRO passo útil: os jobs de verificação esperam por este (needs). Erro ou dúvida = código com todos os pacotes.
      - name: escopo
        id: escopo
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          COMPLETO: ${{ (inputs.completo || inputs.sha) && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/escopo.mjs

  # Em paralelo com o escopo e os testes (sem needs): ninguém espera por ela; o ci-ok exige o success dela.
  governanca:
    name: governança (coord, guardiões, cache do turbo, donos)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Histórico completo: o verificar precisa de origin/main, do merge-base e da base do push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      # Sem pnpm install: tudo aqui é node puro (node:test, sem dependência).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ADR 0045: a 3ª tentativa fica vermelha também aqui (o "Re-run all jobs" roda a governança de novo).
      - name: economia — um rerun só
        run: node scripts/ci/economia-actions.mjs tentativa

      # Só no push: a base (último push VERDE do main) dos donos por commit e do trailer, calculada aqui mesmo (o mesmo
      # escopo.mjs do job escopo, segundos) para a governança não esperar pelo outro job.
      - name: escopo (base do push)
        id: escopo
        if: ${{ github.event_name == 'push' }}
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          COMPLETO: ${{ inputs.completo }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/escopo.mjs

      - name: testes do coord (verificar e recados no GitHub)
        if: ${{ !cancelled() }}
        run: node --test scripts/coord-verificar.test.mjs scripts/coord-recados.test.mjs

      # Testes de TODOS os guardiões (.claude/hooks/*.test.mjs). O glob é expandido pelo bash do runner.
      - name: testes dos guardiões (.claude/hooks)
        if: ${{ !cancelled() }}
        run: node --test .claude/hooks/*.test.mjs

      # ADR 0045: o guardião não desliga no CI nem na nuvem. Vermelho se o job roda com a variável de desligar o guardião
      # (ou a do gh simulado) no ambiente, ou se um workflow/configuração versionada atribui uma delas.
      - name: guardião ligado (CI e nuvem)
        if: ${{ !cancelled() }}
        run: node scripts/ci/guardiao-ligado.mjs

      # Cache do turbo só é seguro se toda dependência fora do grafo declarado estiver nos inputs; e pular os testes em
      # commit só de documentação só é seguro se nenhum código a ler (R4). Testes do escopo e dos shards também (ADR 0014,
      # ADR 0044).
      - name: guardas do CI (scripts/ci)
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/ci/*.test.mjs
          node scripts/ci/grafo-turbo.mjs

      # Só no PR: arquivo fora dos caminhos do agente = violação (saída 1); erro de uso/git = 2.
      # Agente: do branch <agente>/T-nnnn[-assunto], agente/T-nnnn-<agente> ou alexandre/... (GITHUB_HEAD_REF);
      # em nuvem/* e branch fora do padrão, do trailer "Agente: <nome>" de TODOS os commits do PR (sem merges).
      - name: verificar donos do PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/coord.mjs verificar --base "origin/$BASE_REF"

      # ADR 0045, só no PR de nuvem/*: o agente do sufixo do branch (nuvem/<assunto>--<agente>) é o do trailer "Agente:"
      # dos commits. Branch por variável de ambiente, nunca interpolado no shell.
      - name: agente do branch da nuvem × trailer
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/agente-do-branch.mjs

      # ADR 0045, só no PR: mais de um commit vira aviso (cada push é um CI inteiro). Nunca vermelho.
      - name: economia — um commit por PR (aviso)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/economia-actions.mjs commits

      # Só no push ao main: cada commit novo desde o último push VERDE (o cancelado entra) × o agente do trailer "Agente:"
      # dele (guardião v3, .coord/README.md "Por commit"). SHAs por variável de ambiente, nunca interpolados no shell.
      # Base vazia (push que cria o branch) não tem intervalo: o passo pula (o coord sairia com 2).
      - name: verificar donos por commit (push ao main)
        if: ${{ !cancelled() && github.event_name == 'push' && steps.escopo.outputs.base != '' }}
        env:
          BASE: ${{ steps.escopo.outputs.base }}
          DEPOIS: ${{ github.sha }}
        run: node scripts/coord.mjs verificar --por-commit "$BASE..$DEPOIS"

      # T-0049 (brecha 1 do PR #31): commit do push que altera caminho de governança (CAMINHOS_DE_GOVERNANCA da coord-lib:
      # .claude/**, .coord/donos.json, scripts/coord*.mjs, .github/**) sem "Agente: alexandre" no ÚLTIMO bloco da mensagem
      # = vermelho, com commit e arquivos no log. Pega também o squash/merge feito pelo MCP do GitHub (fora do hook do
      # Bash). Merges inclusive (só o que o próprio merge altera). Roda em qualquer escopo (é barato) e entra no ci-ok.
      - name: 'governança no main só com "Agente: alexandre" (push ao main)'
        if: ${{ !cancelled() && github.event_name == 'push' && steps.escopo.outputs.base != '' }}
        env:
          BASE: ${{ steps.escopo.outputs.base }}
          DEPOIS: ${{ github.sha }}
        run: node scripts/ci/brechas-governanca.mjs trailer "$BASE..$DEPOIS"

      # T-0049 (brecha 2 do PR #31): o PR não pode adicionar nem alterar recado (.coord/recados/**) com "autorizo o merge".
      # Autorização de merge só vale escrita localmente pelo Alexandre, nunca vinda de PR. Diff HEAD^1..HEAD (o checkout do
      # PR é o commit de merge com a base). Roda em qualquer escopo (é barato) e entra no ci-ok.
      - name: PR sem recado de autorização de merge
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/brechas-governanca.mjs recados

  estatico:
    name: estático (${{ matrix.parte }})
    needs: escopo
    if: ${{ !cancelled() && contains(needs.escopo.outputs.jobs, '"estatico"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # verificar = lint, fronteiras, timers e typecheck; build = BKO e bundle do app, só se web ou mobile foram afetados
    # (senão nenhum passo roda e a parte termina verde em segundos). Em paralelo: o relógio é o da parte mais lenta.
    strategy:
      fail-fast: false
      matrix:
        parte: [verificar, build]
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.parte == 'verificar' || needs.escopo.outputs.build == 'true' }}
        with:
          ref: ${{ inputs.sha }}

      # Cache do turbo só na parte verificar (o build chama o next e o expo direto, fora do turbo).
      - uses: ./.github/actions/preparar
        if: ${{ matrix.parte == 'verificar' || needs.escopo.outputs.build == 'true' }}
        with:
          cache-turbo: ${{ matrix.parte == 'verificar' && 'estatico' || '' }}

      # lint da raiz inclui tests/ (//#lint:tests); --continue: todos os pacotes rodam e todas as falhas aparecem.
      # FILTRO vazio = todos os pacotes; senão os afetados e o tests/ da raiz (--filter=//).
      - name: lint
        if: ${{ matrix.parte == 'verificar' }}
        env:
          FILTRO: ${{ needs.escopo.outputs.filtro_lint }}
        run: pnpm exec turbo run lint lint:tests --continue $FILTRO

      # fronteiras (dependency-cruiser): módulo só importa packages/*, modules/core/contracts e modules/<outro>/contracts
      - name: fronteiras
        if: ${{ !cancelled() && matrix.parte == 'verificar' }}
        run: pnpm fronteiras

      # RN-CORE-23 (ADR 0018): nenhum timer automático < 15 min no app e no BKO (exceções com "timer-permitido:")
      - name: timers de sincronização
        if: ${{ !cancelled() && matrix.parte == 'verificar' }}
        run: node --test scripts/ci/timers-sync.test.mjs && pnpm timers

      # --concurrency=2: sem o limite, os tsc em paralelo estouram a memória do runner (7 GB) e travam (R-20261120-155015).
      - name: typecheck
        if: ${{ !cancelled() && matrix.parte == 'verificar' }}
        env:
          FILTRO: ${{ needs.escopo.outputs.filtro_typecheck }}
        run: pnpm exec turbo run typecheck typecheck:tests --continue --concurrency=2 $FILTRO

      - uses: ./.github/actions/salvar-turbo
        if: ${{ !cancelled() && matrix.parte == 'verificar' }}
        with:
          cache-turbo: estatico

      # Cache incremental do next build (o próprio Next valida cada entrada).
      - uses: actions/cache@v4
        if: ${{ !cancelled() && matrix.parte == 'build' && needs.escopo.outputs.build == 'true' }}
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ hashFiles('pnpm-lock.yaml') }}-
            next-v1-

      - name: build do Backoffice Web (next build)
        if: ${{ !cancelled() && matrix.parte == 'build' && needs.escopo.outputs.build == 'true' }}
        run: pnpm --filter web build

      # Cache de transformação do Metro: o @expo/metro-config grava em os.tmpdir()/metro-cache (FileStore); o TMPDIR dos
      # bundles aponta para o runner.temp. A chave de cada entrada é o hash do arquivo + a configuração do transformador:
      # entrada velha nunca é usada por engano, só deixa de ser aproveitada.
      - uses: actions/cache@v4
        if: ${{ !cancelled() && matrix.parte == 'build' && needs.escopo.outputs.build == 'true' }}
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            metro-v1-${{ hashFiles('pnpm-lock.yaml') }}-
            metro-v1-

      # T-0004 §7: o mesmo bundle do build do APK (Metro + babel-preset-expo), nas duas variantes.
      # Erro de sintaxe que o tsc aceita e o Babel não fica vermelho aqui, antes de gastar build do APK.
      - name: bundle do app (Metro) — variante campo
        if: ${{ !cancelled() && matrix.parte == 'build' && needs.escopo.outputs.build == 'true' }}
        env:
          APP_VARIANT: campo
          TMPDIR: ${{ runner.temp }}
        run: pnpm --filter mobile bundle:android

      - name: bundle do app (Metro) — variante gestao
        if: ${{ !cancelled() && matrix.parte == 'build' && needs.escopo.outputs.build == 'true' }}
        env:
          APP_VARIANT: gestao
          TMPDIR: ${{ runner.temp }}
        run: pnpm --filter mobile bundle:android

  testes-pacotes:
    name: testes dos pacotes (${{ matrix.shard }}/3)
    needs: escopo
    if: ${{ !cancelled() && contains(needs.escopo.outputs.jobs, '"testes-pacotes"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 3 shards por peso (scripts/ci/shards.mjs): os pacotes do filtro_test e o item "admin sem superusuário" num só shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Mesma imagem do db/docker-compose.yml (T-0002). Os testes de banco criam bancos efêmeros macuxi_teste_*.
    # O segundo (5433) é o do admin sem superusuário: o script exige servidor limpo e apaga os papéis da aplicação.
    services:
      postgres:
        # PostgreSQL 16.15 travado pelo digest (Alexandre, 13/11/2026): a 16.16 mudou a RLS do "on conflict do update" e
        # quebrou 2 testes de db/testes/sessao.test.ts (R-20261113-054319). Trocar pelo digest da 16.16 quando eles passarem.
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      postgres_sem_super:
        # PostgreSQL 16.15 travado pelo digest (Alexandre, 13/11/2026): a 16.16 mudou a RLS do "on conflict do update" e
        # quebrou 2 testes de db/testes/sessao.test.ts (R-20261113-054319). Trocar pelo digest da 16.16 quando eles passarem.
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      # Node do runner basta (node puro, sem dependência). vazio=true: nenhum pacote turbo neste shard.
      - name: shards
        id: shards
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: '3'
          FILTRO: ${{ needs.escopo.outputs.filtro_test }}
          DB_SEM_SUPER: ${{ needs.escopo.outputs.db_sem_super }}
        run: node scripts/ci/shards.mjs

      # Shard sem nada (sem pacote e sem o admin sem superusuário): sem preparação, verde em segundos.
      - uses: ./.github/actions/preparar
        if: ${{ steps.shards.outputs.vazio == 'false' || steps.shards.outputs.db_sem_super == 'true' }}
        with:
          cache-turbo: testes-${{ matrix.shard }}

      # db#test e api#test têm cache false no turbo.json: sempre rodam quando selecionados.
      # CRÍTICO: só com vazio == 'false' (nunca "!= 'true'"): turbo run test sem filtro rodaria TODOS os pacotes.
      - name: testes
        if: ${{ steps.shards.outputs.vazio == 'false' }}
        env:
          FILTRO: ${{ steps.shards.outputs.filtro }}
        run: pnpm exec turbo run test --continue $FILTRO

      # T-0075 (R-20261105-111837, autorizado pelo Alexandre em R-20261105-191229): a suíte do @macuxi/db com um admin SEM
      # superusuário, como o do DBaaS da Magalu (LOGIN, CREATEDB, CREATEROLE, sem SUPERUSER/BYPASSRLS/REPLICATION, membro
      # de pg_read_all_data e pg_write_all_data), no Postgres próprio (5433). MACUXI_PG_ADMIN_SEM_SUPER=1 faz o globalSetup
      # falhar se o admin ignorar RLS. Os casos de up/down com dados antes da 0031 pulam neste modo; o passo "testes" cobre
      # esses casos com superusuário. Só quando o @macuxi/db foi afetado (ou todos os pacotes), no shard que recebe o item.
      - name: admin sem superusuário (como o do DBaaS)
        if: ${{ !cancelled() && steps.shards.outputs.db_sem_super == 'true' }}
        env:
          MACUXI_PG_PORTA: '5433'
        run: pnpm --filter @macuxi/db admin-sem-superusuario

      # Senha pública do modo (db/scripts/admin-sem-superusuario.ts): só existe no Postgres descartável deste job.
      - name: testes do @macuxi/db sem superusuário
        if: ${{ !cancelled() && steps.shards.outputs.db_sem_super == 'true' }}
        env:
          MACUXI_PG_PORTA: '5433'
          MACUXI_PG_ADMIN_USUARIO: macuxi_admin_sem_super
          MACUXI_PG_ADMIN_SENHA: macuxi_admin_sem_super_ci
          MACUXI_PG_ADMIN_SEM_SUPER: '1'
        run: pnpm --filter @macuxi/db test

      - uses: ./.github/actions/salvar-turbo
        if: ${{ !cancelled() && steps.shards.outputs.vazio == 'false' }}
        with:
          cache-turbo: testes-${{ matrix.shard }}

  testes-integracao:
    name: testes de integração (tests/, ${{ matrix.shard }}/3)
    needs: escopo
    if: ${{ !cancelled() && contains(needs.escopo.outputs.jobs, '"testes-integracao"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        # PostgreSQL 16.15 travado pelo digest (Alexandre, 13/11/2026): a 16.16 mudou a RLS do "on conflict do update" e
        # quebrou 2 testes de db/testes/sessao.test.ts (R-20261113-054319). Trocar pelo digest da 16.16 quando eles passarem.
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/preparar

      # //#test:tests (agente testes): a suíte em 3 shards do vitest (por arquivo), um Postgres por shard; cada shard paga
      # a preparação, em troca de relógio (R-20261114-221000-alexandre; antes um job só). Sem cache (cache false no
      # turbo.json). O pnpm repassa o --shard ao vitest sem "--". Sem a Fase M no runner, S0-006/007 pulam sozinhos.
      - name: testes de tests/
        run: pnpm test:tests --shard=${{ matrix.shard }}/3

  # Check obrigatório (ADR 0014). Verde só se o escopo e a governança passarem, TODO job da lista do escopo terminar em
  # success (job em matriz: success só com todas as partes/shards verdes) e TODO job fora dela ficar "skipped". Qualquer
  # outra combinação (falha, cancelado, pulado sem motivo, escopo vazio) = vermelho. Roda sempre (if: always()), menos no
  # PR em rascunho, para nunca ficar "pulado".
  ci-ok:
    name: ci-ok
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [escopo, governanca, estatico, testes-pacotes, testes-integracao]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: todos os jobs como o escopo pediu
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          ESCOPO: ${{ needs.escopo.outputs.escopo }}
          JOBS: ${{ needs.escopo.outputs.jobs }}
          SHA_DA_VERSAO: ${{ inputs.sha }}
        run: |
          echo "escopo: ${ESCOPO:-?} · jobs: ${JOBS:-?}"
          echo "$RESULTADOS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ -z "$ESCOPO" ] || ! echo "$JOBS" | jq -e 'type == "array"' > /dev/null; then
            echo "::error::CI vermelho: o job escopo não decidiu o escopo"
            exit 1
          fi
          # Com "sha" (manual ou liberar) a suíte da versão nunca sai verde sem os testes.
          if [ -n "$SHA_DA_VERSAO" ] && ! echo "$JOBS" | jq -e 'index("testes-pacotes") != null and index("testes-integracao") != null' > /dev/null; then
            echo "::error::CI vermelho: a suíte do commit $SHA_DA_VERSAO precisa de testes-pacotes e testes-integracao"
            exit 1
          fi
          ruins=$(echo "$RESULTADOS" | jq -r --argjson jobs "$JOBS" '[to_entries[] | select(
            ((.key == "escopo" or .key == "governanca") and .value.result != "success") or
            ((.key == "escopo" or .key == "governanca" | not) and (.key as $k | $jobs | index($k)) != null and .value.result != "success") or
            ((.key == "escopo" or .key == "governanca" | not) and (.key as $k | $jobs | index($k)) == null and .value.result != "skipped")
          ) | .key] | join(", ")')
          if [ -n "$ruins" ]; then
            echo "::error::CI vermelho (escopo $ESCOPO) — jobs fora do esperado: $ruins"
            exit 1
          fi
          echo "CI verde (escopo $ESCOPO)."

      # Item 2 da T-0160: a árvore testada COM as suítes fica registrada; o push ao main da MESMA árvore (o ensaio que
      # sobe em fast-forward) não repete o estático. O escopo.mjs confere o run e a árvore do commit dele.
      - name: registro da árvore verde
        id: registro
        if: ${{ success() && needs.escopo.outputs.escopo == 'codigo' && contains(needs.escopo.outputs.jobs, '"testes-integracao"') }}
        run: echo "${{ github.run_id }}" > ci-verde.txt

      - uses: actions/upload-artifact@v4
        if: ${{ steps.registro.outcome == 'success' }}
        with:
          name: ci-verde-${{ needs.escopo.outputs.matriz }}-${{ needs.escopo.outputs.arvore }}
          path: ci-verde.txt
          retention-days: 14
