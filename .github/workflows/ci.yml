name: CI

# T-0005 → T-0033 (ADR 0014). Jobs PARALELOS, cada um num runner próprio, sem fail-fast; dentro de cada job todos os
# passos rodam mesmo depois de uma falha (R-20261101-014652): nada quebra escondido atrás da primeira falha.
#   governanca  coord, guardiões, guardas de scripts/ci, donos do PR / por commit, brechas do guardião v5 (T-0049:
#               governança no main só com "Agente: alexandre"; PR sem recado "autorizo o merge"); e DECIDE o escopo e as matrizes
#               (scripts/ci/escopo.mjs): commit/PR só de COORDENAÇÃO (.coord/**, docs/status/**, docs/backlog.md,
#               docs/produto/**) = roda só ela e o ci-ok; o resto de docs/** não entra (a guarda R4 prova que nenhum
#               código lê os caminhos de coordenação).
#   lint · typecheck · testes-pacotes (Postgres) · testes-integracao (tests/, Postgres) · build (BKO + bundle do app)
#   ci-ok       agrega todos: é o check a olhar.
# Matrizes (ADR 0014 §custo; repositório privado no plano gratuito, minuto cobrado por job arredondado para cima):
#   PR e push ao main          → ENXUTA: typecheck e testes de pacotes em 1 grupo; tests/ em 2 partes.
#   agendado (07:00 UTC) e manual → COMPLETA: typecheck e testes de pacotes em 2 grupos; tests/ em 3 partes.
# Cache do Turborepo (.turbo/cache) em lint, typecheck e testes-pacotes: no PR só roda o que mudou; no main (push,
# agendado e manual) TURBO_FORCE roda TUDO e regrava o cache. Node 24 (.nvmrc e engines >=24.7 do package.json).

on:
  pull_request:
  push:
    branches: [main]
  # Run completo diário (matriz completa, tudo forçado) sobre o main: 07:00 UTC = 03:00 em Manaus. O gerente confere no
  # início da rodada (gh run list --workflow CI --event schedule --limit 1).
  schedule:
    - cron: '0 7 * * *'
  # Manual (Actions → CI → Run workflow, ou gh workflow run CI): matriz completa no branch escolhido.
  workflow_dispatch:

permissions:
  contents: read

# PR: um grupo por PR e push novo CANCELA o run antigo (só o último commit importa).
# push ao main, agendado e manual: um grupo por evento + commit e NADA é cancelado — o "verificar --por-commit" só
# confere ANTES..DEPOIS daquele push; cancelar deixaria commits do main sem verificação de donos.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Teste de banco FALHA (em vez de pular) se o Postgres não responder. O turbo.json repassa MACUXI_PG_*.
  MACUXI_PG_EXIGIR: '1'
  # O Postgres do CI é o service container: nunca tentar subir o docker compose no runner.
  MACUXI_PG_AUTO_SUBIR: '0'
  MACUXI_PG_HOST: localhost
  MACUXI_PG_PORTA: '5432'
  MACUXI_PG_ADMIN_USUARIO: postgres
  MACUXI_PG_ADMIN_SENHA: postgres
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CACHE_DIR: .turbo/cache
  # PR: lê o cache. Push ao main, agendado e manual: não lê (só grava) — fora do PR o CI sempre roda tudo.
  TURBO_FORCE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

jobs:
  governanca:
    name: governança (coord, guardiões, cache do turbo, donos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      escopo: ${{ steps.escopo.outputs.escopo }}
      typecheck: ${{ steps.escopo.outputs.typecheck }}
      pacotes: ${{ steps.escopo.outputs.pacotes }}
      integracao: ${{ steps.escopo.outputs.integracao }}
    steps:
      # Histórico completo: o verificar --base precisa de origin/main e do merge-base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sem pnpm install: tudo aqui é node puro (node:test, sem dependência).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # PRIMEIRO passo útil: os outros jobs esperam por este (needs). Erro ou dúvida = escopo completo.
      - name: escopo e matrizes
        id: escopo
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: node scripts/ci/escopo.mjs

      - name: testes do coord (verificar)
        if: ${{ !cancelled() }}
        run: node --test scripts/coord-verificar.test.mjs

      # Testes de TODOS os guardiões (.claude/hooks/*.test.mjs). O glob é expandido pelo bash do runner.
      - name: testes dos guardiões (.claude/hooks)
        if: ${{ !cancelled() }}
        run: node --test .claude/hooks/*.test.mjs

      # Cache do turbo só é seguro se toda dependência fora do grafo declarado estiver nos inputs; e pular a matriz
      # em commit só de coordenação só é seguro se nenhum código ler esses caminhos (R4). Testes do escopo também (ADR 0014).
      - name: guardas do CI (scripts/ci)
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/ci/*.test.mjs
          node scripts/ci/grafo-turbo.mjs

      # Só no PR: arquivo fora dos caminhos do agente = violação (saída 1); erro de uso/git = 2.
      # Agente: do branch <agente>/T-nnnn[-assunto], agente/T-nnnn-<agente> ou alexandre/... (GITHUB_HEAD_REF);
      # em nuvem/* e branch fora do padrão, do trailer "Agente: <nome>" de TODOS os commits do PR (sem merges).
      - name: verificar donos do PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/coord.mjs verificar --base "origin/$BASE_REF"

      # Só no push ao main: cada commit novo (git log ANTES..DEPOIS, sem merges) × o agente do trailer "Agente:" dele
      # (guardião v3, .coord/README.md "Por commit"). SHAs por variável de ambiente, nunca interpolados no shell.
      # ANTES = 000…0 (push que cria o branch) não tem intervalo: o passo pula (o coord sairia com 2).
      - name: verificar donos por commit (push ao main)
        if: ${{ !cancelled() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: node scripts/coord.mjs verificar --por-commit "$ANTES..$DEPOIS"

      # T-0049 (brecha 1 do PR #31): commit do push que altera caminho de governança (CAMINHOS_DE_GOVERNANCA da coord-lib:
      # .claude/**, .coord/donos.json, scripts/coord*.mjs, .github/**) sem "Agente: alexandre" no ÚLTIMO bloco da mensagem
      # = vermelho, com commit e arquivos no log. Pega também o squash/merge feito pelo MCP do GitHub (fora do hook do
      # Bash). Merges inclusive (só o que o próprio merge altera). Roda em qualquer escopo (é barato) e entra no ci-ok.
      - name: 'governança no main só com "Agente: alexandre" (push ao main)'
        if: ${{ !cancelled() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: node scripts/ci/brechas-governanca.mjs trailer "$ANTES..$DEPOIS"

      # T-0049 (brecha 2 do PR #31): o PR não pode adicionar nem alterar recado (.coord/recados/**) com "autorizo o merge".
      # Autorização de merge só vale escrita localmente pelo Alexandre, nunca vinda de PR. Diff HEAD^1..HEAD (o checkout do
      # PR é o commit de merge com a base). Roda em qualquer escopo (é barato) e entra no ci-ok.
      - name: PR sem recado de autorização de merge
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/brechas-governanca.mjs recados

  lint:
    name: lint e fronteiras
    needs: governanca
    if: ${{ !cancelled() && needs.governanca.outputs.escopo == 'completo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          cache-turbo: lint

      # lint da raiz inclui tests/ (//#lint:tests); --continue: todos os pacotes rodam e todas as falhas aparecem.
      - name: lint
        run: pnpm exec turbo run lint lint:tests --continue

      # fronteiras (dependency-cruiser): módulo só importa packages/*, modules/core/contracts e modules/<outro>/contracts
      - name: fronteiras
        if: ${{ !cancelled() }}
        run: pnpm fronteiras

      # RN-CORE-23 (ADR 0018): nenhum timer automático < 15 min no app e no BKO (exceções com "timer-permitido:")
      - name: timers de sincronização
        if: ${{ !cancelled() }}
        run: node --test scripts/ci/timers-sync.test.mjs && pnpm timers

      - uses: ./.github/actions/salvar-turbo
        if: ${{ !cancelled() }}
        with:
          cache-turbo: lint

  typecheck:
    name: typecheck (${{ matrix.grupo }})
    needs: governanca
    if: ${{ !cancelled() && needs.governanca.outputs.escopo == 'completo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # PR e push: 1 grupo ("todos"). Agendado e manual: core-vendedor (~30% do tsc) e "demais" por EXCLUSÃO (inclui o
      # //#typecheck:tests; pacote novo cai nele sozinho). Definição em scripts/ci/escopo.mjs.
      matrix:
        include: ${{ fromJSON(needs.governanca.outputs.typecheck) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          cache-turbo: ${{ matrix.cache }}
          cache-turbo-extra: ${{ matrix.cache_extra }}

      - name: typecheck
        env:
          FILTRO: ${{ matrix.filtro }}
        run: pnpm exec turbo run typecheck typecheck:tests --continue $FILTRO

      - uses: ./.github/actions/salvar-turbo
        if: ${{ !cancelled() }}
        with:
          cache-turbo: ${{ matrix.cache }}

  testes-pacotes:
    name: testes dos pacotes (${{ matrix.grupo }})
    needs: governanca
    if: ${{ !cancelled() && needs.governanca.outputs.escopo == 'completo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # PR e push: 1 grupo ("todos"). Agendado e manual: os 4 mais pesados (core, db, api, mock-api) num runner e TODO o
      # resto no outro, por EXCLUSÃO (pacote novo cai nele sozinho). Definição em scripts/ci/escopo.mjs.
      matrix:
        include: ${{ fromJSON(needs.governanca.outputs.pacotes) }}

    # Mesma imagem do db/docker-compose.yml (T-0002). Os testes de banco criam bancos efêmeros macuxi_teste_*.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          cache-turbo: ${{ matrix.cache }}
          cache-turbo-extra: ${{ matrix.cache_extra }}

      # db#test e api#test têm cache false no turbo.json: sempre rodam.
      - name: testes
        env:
          FILTRO: ${{ matrix.filtro }}
        run: pnpm exec turbo run test --continue $FILTRO

      - uses: ./.github/actions/salvar-turbo
        if: ${{ !cancelled() }}
        with:
          cache-turbo: ${{ matrix.cache }}

  testes-integracao:
    name: testes de integração (tests/, ${{ matrix.parte }})
    needs: governanca
    if: ${{ !cancelled() && needs.governanca.outputs.escopo == 'completo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # O shard do Vitest divide por hash do caminho, não por tempo: o visitas-campo (~60 s, 40% da suíte) fica numa
      # execução só dele e o RESTO é dividido em 2 shards por exclusão (arquivo novo cai neles sozinho; se ele mudar de
      # nome, a execução dele falha com "No test files found"). Agendado e manual: 3 jobs (visitas | resto 1/2 |
      # resto 2/2). PR e push: 2 jobs (visitas + resto 2/2 em sequência | resto 1/2). Definição em scripts/ci/escopo.mjs.
      matrix:
        include: ${{ fromJSON(needs.governanca.outputs.integracao) }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar

      # //#test:tests (agente testes): a união das partes é a suíte inteira. Cada job tem Postgres e globalSetup próprios;
      # sem cache (cache false no turbo.json). Sem a Fase M no runner, S0-006/007 pulam sozinhos.
      # ARGS = execuções do Vitest separadas por "|": TODAS rodam (a falha de uma não pula a outra) e o passo falha se
      # qualquer uma falhar. set -f: o "**/..." do --exclude chega literal ao Vitest.
      - name: testes de tests/ (${{ matrix.parte }})
        env:
          ARGS: ${{ matrix.args }}
        run: |
          set -f
          IFS='|' read -ra execucoes <<< "$ARGS"
          falhou=0
          for e in "${execucoes[@]}"; do
            echo "::group::vitest $e"
            IFS=' ' read -ra a <<< "$e"
            pnpm test:tests "${a[@]}" || falhou=1
            echo "::endgroup::"
          done
          exit $falhou

  build:
    name: build do Backoffice Web e bundle do app
    needs: governanca
    if: ${{ !cancelled() && needs.governanca.outputs.escopo == 'completo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar

      # Cache incremental do next build (o próprio Next valida cada entrada).
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ hashFiles('pnpm-lock.yaml') }}-
            next-v1-

      - name: build do Backoffice Web (next build)
        run: pnpm --filter web build

      # T-0004 §7: o mesmo bundle que o EAS roda na fase EAGER_BUNDLE (Metro + babel-preset-expo), nas duas variantes.
      # Erro de sintaxe que o tsc aceita e o Babel não fica vermelho aqui, antes de gastar build da Expo.
      - name: bundle do app (Metro) — variante campo
        if: ${{ !cancelled() }}
        env:
          APP_VARIANT: campo
        run: pnpm --filter mobile bundle:android

      - name: bundle do app (Metro) — variante gestao
        if: ${{ !cancelled() }}
        env:
          APP_VARIANT: gestao
        run: pnpm --filter mobile bundle:android

  # Check obrigatório (ADR 0014). Escopo completo: verde só se TODOS os jobs terminarem em success. Escopo coordenacao: verde
  # só se a governança passar e TODOS os outros forem "skipped". Qualquer outra combinação (falha, cancelado, pulado
  # sem motivo, escopo vazio) = vermelho. Roda sempre (if: always()) para nunca ficar "pulado".
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [governanca, lint, typecheck, testes-pacotes, testes-integracao, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: todos os jobs verdes
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          ESCOPO: ${{ needs.governanca.outputs.escopo }}
        run: |
          echo "escopo: ${ESCOPO:-?}"
          echo "$RESULTADOS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$ESCOPO" = "coordenacao" ]; then
            ruins=$(echo "$RESULTADOS" | jq -r '[to_entries[] | select((.key == "governanca" and .value.result != "success") or (.key != "governanca" and .value.result != "skipped")) | .key] | join(", ")')
          else
            ruins=$(echo "$RESULTADOS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          fi
          if [ -n "$ruins" ]; then
            echo "::error::CI vermelho (escopo ${ESCOPO:-?}) — jobs fora do esperado: $ruins"
            exit 1
          fi
          echo "CI verde (escopo $ESCOPO)."
