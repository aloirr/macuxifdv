name: producao — diagnóstico da outbox (só leitura)

# Para o OUTBOX_PARADA (relatório docs/desenho/outbox-parada-v1014.md, §4 e §6). Só manual, só no environment PRODUCAO
# (aprovação do Alexandre) e SÓ LEITURA: nada se corrige, cancela ou reprocessa aqui (isso continua dependendo do "sim" dele).
#
# Como funciona (sem secret de senha; o macuxi_leitura só tem LOGIN durante a execução):
# - O DBaaS só tem IP privado na VPC: tudo roda na VM, pelo SSH, com o psql 16 (pgvector/pgvector:pg16).
# - LOGIN pelo pgcliente (admin), numa transação que confere antes que o macuxi_leitura segue só leitura (0078, ADR 0055);
#   consulta num contêiner descartável, sem o admin.env, só leitura e com rollback.
# - Desligar (sempre que o LOGIN foi tentado, mesmo com a consulta em erro): "alter role ... nologin password null", com a
#   conferência no resumo. Se o runner cair antes disso, a senha some com ele; rode de novo para desligar.
# - O total de parados de TODAS as empresas sai antes pelo GET /v1/saude público (dependencias.outbox), para conferir se
#   as empresas consultadas somam o número do alerta.
#
# O que o log mostra: docs/desenho/outbox-parada-v1014.md, §6. Bloco do catálogo (nós e produtos do ERP parados, só quando
# há algum): modules/integracao/docs/outbox-parada-am2808-catalogo.md, §6.

on:
  workflow_dispatch:
    inputs:
      empresas:
        description: códigos das empresas, separados por vírgula (ex. thathyany ou AM1234,outra)
        required: true
        default: thathyany

permissions:
  contents: read

concurrency:
  group: producao-vm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  diagnostico:
    name: outbox parada (só leitura)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: PRODUCAO
    env:
      PGCLIENTE: docker compose --env-file .env --env-file imagens.env --profile ferramentas run --rm -T -e MACUXI_LEITURA_VERIFICADOR pgcliente psql -X -f -
    steps:
      - name: entradas e consulta
        env:
          EMPRESAS: ${{ inputs.empresas }}
        run: |
          IFS=',' read -ra lista <<< "${EMPRESAS// /}"
          [ "${#lista[@]}" -ge 1 ] && [ "${#lista[@]}" -le 10 ] || { echo "::error::informe de 1 a 10 códigos de empresa"; exit 1; }
          sql="$RUNNER_TEMP/consulta.sql"
          cat > "$sql" <<'SQL'
          \set ON_ERROR_STOP on
          \set QUIET on
          \pset pager off
          \pset null '-'
          \pset footer off
          \set max 10
          begin transaction read only;
          -- trava: só o papel de leitura e só transação de leitura (senão aborta antes de ler qualquer linha)
          do $$ begin
            if current_user <> 'macuxi_leitura' or current_setting('transaction_read_only') <> 'on' then
              raise exception 'diagnóstico recusado: papel % ou transação que não é só leitura', current_user;
            end if;
          end $$;
          \echo papel macuxi_leitura, transação só leitura
          SQL
          for c in "${lista[@]}"; do
            [[ "$c" =~ ^[a-z0-9][a-z0-9-]{1,39}$ || "$c" =~ ^[A-Z]{2}[0-9]{4}$ ]] || { echo "::error::código de empresa inválido: $c"; exit 1; }
            sed "s/__CODIGO__/$c/" <<'SQL' >> "$sql"
          \echo
          \echo '### empresa __CODIGO__'
          select count(*) = 1 as achou from plataforma.tenant_por_codigo('__CODIGO__') \gset
          \if :achou
          select set_config('app.tenant_id', id::text, true) <> '' as ok from plataforma.tenant_por_codigo('__CODIGO__') \gset
          \echo 'resumo (eventos ainda não publicados)'
          select count(*) filter (where e.tentativas >= :max) as parados,
                 count(*) filter (where e.tentativas between 1 and :max - 1) as em_nova_tentativa,
                 to_char(min(e.ocorrido_em) filter (where e.tentativas >= :max) at time zone 'America/Manaus', 'DD/MM/YYYY HH24:MI') as primeiro_parado_manaus
            from plataforma.evento e
           where e.publicado_em is null and e.deleted_at is null;
          \echo 'parados por evento, entidade do lote e classe do erro (do mais antigo para o mais novo; a 1a linha costuma ser a raiz)'
          select e.nome as evento,
                 l.entidade as entidade_lote,
                 l.status as status_lote,
                 count(*) as parados,
                 min(e.tentativas) || '-' || max(e.tentativas) as tentativas,
                 to_char(min(e.ocorrido_em) at time zone 'America/Manaus', 'DD/MM HH24:MI') as primeiro_manaus,
                 to_char(max(e.ocorrido_em) at time zone 'America/Manaus', 'DD/MM HH24:MI') as ultimo_manaus,
                 c.classe_erro
            from plataforma.evento e
            left join integracao.lote l
              on e.nome = 'integracao.lote.recebido@1' and l.tenant_id = e.tenant_id and l.id = e.agregado_id
            -- classe do erro sem texto livre: só o módulo e um rótulo fixo, um código (SQLSTATE, HTTP) ou o nome da classe
            -- do erro; o resto da mensagem nunca sai (ultimo_erro = "<módulo>: <Nome>: <mensagem>", 1a falha antes de " | ")
            cross join lateral (select split_part(coalesce(e.ultimo_erro, ''), ' | ', 1) as x) u
            cross join lateral (select case when u.x = '' then '(sem erro)' else
                   case when split_part(u.x, ':', 1) ~ '^[a-z_]{1,20}$' then split_part(u.x, ':', 1) else '?' end || ': ' ||
                   case when u.x like '%Lote aguardando o lote anterior da mesma entidade%' then 'espera da mesma entidade'
                        when u.x like '%Lote aguardando a carga de%' then 'espera de dependência'
                        when u.x like '%: efeito depois do commit: %' then 'efeito ' ||
                             coalesce(substring(u.x from 'HTTP [0-9]{3}'), substring(u.x from 'SQLSTATE [0-9A-Z]{5}'), 'outro')
                        -- no 23505, o índice único que bateu (nome do objeto do banco, não texto livre)
                        when u.x ~ 'SQLSTATE 23505, [a-z_][a-z0-9_]{0,62}' then substring(u.x from 'SQLSTATE 23505, [a-z_][a-z0-9_]{0,62}')
                        when u.x ~ 'SQLSTATE [0-9A-Z]{5}' then substring(u.x from 'SQLSTATE [0-9A-Z]{5}')
                        when btrim(split_part(u.x, ':', 2)) ~ '^(Erro[A-Z][A-Za-z]{0,40}|[A-Z][A-Za-z]{0,40}Error|ReferenciaAusenteErp)$'
                             then btrim(split_part(u.x, ':', 2))
                        else 'outro' end end as classe_erro) c
           where e.publicado_em is null and e.deleted_at is null and e.tentativas >= :max
           group by 1, 2, 3, 8
           order by min(e.ocorrido_em), 1;
          \echo 'fila de lotes do Hub (recebido ou processando)'
          select l.entidade, l.status, count(*) as lotes, count(distinct l.conector_id) as conectores,
                 to_char(min(l.recebido_em) at time zone 'America/Manaus', 'DD/MM HH24:MI') as primeiro_manaus,
                 to_char(max(l.recebido_em) at time zone 'America/Manaus', 'DD/MM HH24:MI') as ultimo_manaus
            from integracao.lote l
           where l.status in ('recebido', 'processando') and l.deleted_at is null
           group by 1, 2
           order by min(l.recebido_em);
          -- catálogo: só cadastro de produto e grupo
          select exists (select 1 from plataforma.evento e
                          where e.publicado_em is null and e.deleted_at is null and e.tentativas >= :max
                            and e.nome in ('integracao.catalogo_no.atualizado@1', 'integracao.produto.atualizado@1')) as tem_catalogo \gset
          \if :tem_catalogo
          \echo 'catálogo: nós parados (indice = índice único do 23505)'
          select to_char(e.ocorrido_em at time zone 'America/Manaus', 'DD/MM/YYYY HH24:MI') as ocorrido_manaus,
                 e.tentativas,
                 substring(e.ultimo_erro from 'SQLSTATE 23505, ([a-z_][a-z0-9_]{0,62})') as indice,
                 e.payload->>'acao' as acao,
                 e.payload->>'external_id' as external_id,
                 e.payload->'registro'->>'codigo' as codigo,
                 e.payload->'registro'->>'nome' as nome,
                 e.payload->'registro'->>'nivel' as nivel,
                 e.payload->'registro'->>'pai_external_id' as pai_external_id
            from plataforma.evento e
           where e.publicado_em is null and e.deleted_at is null and e.tentativas >= :max
             and e.nome = 'integracao.catalogo_no.atualizado@1'
           order by e.ocorrido_em, e.id
           limit 200;
          \echo 'catálogo: nó vivo com o mesmo código ou o mesmo external_id de um nó parado'
          select p.external_id as parado_external_id,
                 concat_ws(' e ', case when n.codigo = p.codigo then 'codigo' end,
                           case when n.external_id = p.external_id then 'external_id' end) as mesma_chave,
                 n.external_id, n.codigo, n.nome, n.nivel, pai.codigo as pai_codigo,
                 to_char(n.created_at at time zone 'America/Manaus', 'DD/MM/YYYY HH24:MI') as criado_manaus
            from (select distinct e.payload->>'external_id' as external_id, e.payload->'registro'->>'codigo' as codigo
                    from plataforma.evento e
                   where e.publicado_em is null and e.deleted_at is null and e.tentativas >= :max
                     and e.nome = 'integracao.catalogo_no.atualizado@1') p
            join catalogo.catalogo_no n
              on n.deleted_at is null and (n.codigo = p.codigo or n.external_id = p.external_id)
            left join catalogo.catalogo_no pai on pai.tenant_id = n.tenant_id and pai.id = n.pai_id
           order by p.external_id, n.created_at
           limit 200;
          \echo 'catálogo: produtos parados (faltou = entidade da ReferenciaAusenteErp)'
          select to_char(e.ocorrido_em at time zone 'America/Manaus', 'DD/MM/YYYY HH24:MI') as ocorrido_manaus,
                 substring(e.ultimo_erro from 'registro\(s\) de ([a-z_]+)') as faltou,
                 e.payload->>'external_id' as external_id,
                 e.payload->'registro'->>'sku' as sku,
                 e.payload->'registro'->>'nome' as nome,
                 e.payload->'registro'->>'catalogo_no_external_id' as catalogo_no_external_id,
                 exists (select 1 from catalogo.produto_no pn
                          where pn.external_id = e.payload->>'external_id' and pn.deleted_at is null) as tem_grupo_vivo
            from plataforma.evento e
           where e.publicado_em is null and e.deleted_at is null and e.tentativas >= :max
             and e.nome = 'integracao.produto.atualizado@1'
           order by e.ocorrido_em, e.id
           limit 200;
          \endif
          \else
          \echo 'empresa não encontrada (código errado ou empresa excluída)'
          \endif
          SQL
          done
          echo 'rollback;' >> "$sql"

      - name: total do alerta (GET /v1/saude público)
        run: |
          corpo="$(curl -fsS -m 15 https://api.macuxifdv.com.br/v1/saude 2>/dev/null || true)"
          total="$(printf '%s' "$corpo" | jq -c '.dependencias.outbox // empty' 2>/dev/null || true)"
          if [ -n "$total" ]; then linha="todas as empresas (saude): $total"; else linha="todas as empresas: /v1/saude sem o resumo da outbox"; fi
          echo "$linha"
          { echo "## Diagnóstico da outbox (só leitura)"; echo; echo "- $linha"; } >> "$GITHUB_STEP_SUMMARY"

      - name: chave SSH
        env:
          CHAVE: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_HOST }}
          CONHECIDOS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/prod
          chmod 600 ~/.ssh/prod
          if [ -n "$CONHECIDOS" ]; then printf '%s\n' "$CONHECIDOS" | tr -d '\r' > ~/.ssh/known_hosts
          else ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
          printf 'Host prod\n  HostName %s\n  IdentityFile ~/.ssh/prod\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: senha temporária e verificador SCRAM
        run: |
          umask 077
          senha="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9')"
          printf '::add-mask::%s\n' "$senha"
          printf '%s\n' "$senha" > "$RUNNER_TEMP/senha"
          unset senha
          # Mesmo algoritmo de db/src/scram.ts (RFC 5802/7677, 4096 iterações, sal de 16 bytes); a senha vem do arquivo.
          cat > "$RUNNER_TEMP/scram.mjs" <<'JS'
          import { createHash, createHmac, pbkdf2Sync, randomBytes } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const senha = readFileSync(process.argv[2], 'utf8').trim();
          if (!/^[\x21-\x7e]+$/.test(senha)) process.exit(2);
          const sal = randomBytes(16);
          const iteracoes = 4096;
          const salgada = pbkdf2Sync(senha, sal, iteracoes, 32, 'sha256');
          const chaveCliente = createHmac('sha256', salgada).update('Client Key').digest();
          const chaveGuardada = createHash('sha256').update(chaveCliente).digest();
          const chaveServidor = createHmac('sha256', salgada).update('Server Key').digest();
          process.stdout.write(`SCRAM-SHA-256$${iteracoes}:${sal.toString('base64')}$${chaveGuardada.toString('base64')}:${chaveServidor.toString('base64')}`);
          JS
          verificador="$(node "$RUNNER_TEMP/scram.mjs" "$RUNNER_TEMP/senha")"
          printf '::add-mask::%s\n' "$verificador"
          [[ "$verificador" =~ ^SCRAM-SHA-256\$4096:[A-Za-z0-9+/=]+\$[A-Za-z0-9+/=]+:[A-Za-z0-9+/=]+$ ]] || { echo "::error::verificador SCRAM inválido"; exit 1; }
          printf '%s\n' "$verificador" > "$RUNNER_TEMP/verificador"

      - name: LOGIN temporário no macuxi_leitura
        id: login
        env:
          USUARIO: ${{ secrets.PROD_USER }}
        run: |
          # Conferência do só leitura (0078 e AJUSTES_LEITURA de db/src/papeis.ts); roda antes do LOGIN.
          cat > "$RUNNER_TEMP/login.sql" <<'SQL'
          \set ON_ERROR_STOP on
          \set QUIET on
          \set VERBOSITY terse
          \set SHOW_CONTEXT never
          \getenv verificador MACUXI_LEITURA_VERIFICADOR
          begin;
          do $$
          declare
            v_x text;
          begin
            select string_agg(x, ', ') into v_x from (
              select 'SUPERUSER' as x from pg_roles where rolname = 'macuxi_leitura' and rolsuper
              union all select 'BYPASSRLS' from pg_roles where rolname = 'macuxi_leitura' and rolbypassrls
              union all select 'CREATEDB' from pg_roles where rolname = 'macuxi_leitura' and rolcreatedb
              union all select 'CREATEROLE' from pg_roles where rolname = 'macuxi_leitura' and rolcreaterole
              union all select 'REPLICATION' from pg_roles where rolname = 'macuxi_leitura' and rolreplication
              union all select 'membro de ' || b.rolname from pg_auth_members m join pg_roles b on b.oid = m.roleid
                         where m.member = 'macuxi_leitura'::regrole
              union all select 'escrita em ' || c.oid::regclass::text
                          from pg_class c join pg_namespace n on n.oid = c.relnamespace
                         where c.relkind in ('r', 'p', 'v', 'm', 'f')
                           and n.nspname not in ('pg_catalog', 'information_schema') and n.nspname not like 'pg\_%'
                           and (has_table_privilege('macuxi_leitura', c.oid, 'INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')
                                or has_any_column_privilege('macuxi_leitura', c.oid, 'INSERT, UPDATE, REFERENCES'))
              union all select 'CREATE no schema ' || n.nspname from pg_namespace n
                         where n.nspname <> 'information_schema' and n.nspname not like 'pg\_%'
                           and has_schema_privilege('macuxi_leitura', n.oid, 'CREATE')
              union all select 'CREATE no banco' where has_database_privilege('macuxi_leitura', current_database(), 'CREATE')
              union all select 'sem o ajuste ' || a
                          from unnest(array['default_transaction_read_only=on', 'statement_timeout=15s',
                                            'idle_in_transaction_session_timeout=60s']) a
                         where not coalesce((select s.setconfig from pg_db_role_setting s
                                              where s.setdatabase = 0 and s.setrole = 'macuxi_leitura'::regrole), '{}') @> array[a]
            ) t;
            if v_x is not null then
              raise exception 'macuxi_leitura não está só leitura: %', v_x using errcode = '42501';
            end if;
          end
          $$;
          \echo antes: macuxi_leitura só leitura
          alter role macuxi_leitura login password :'verificador';
          do $$ begin
            if not (select rolcanlogin from pg_roles where rolname = 'macuxi_leitura') then raise exception 'LOGIN não gravado'; end if;
          end $$;
          commit;
          \echo depois: LOGIN temporário ligado
          SQL
          # Na VM (sh POSIX): 1ª linha do stdin = verificador (vai para o ambiente, nunca para o argv); o resto do stdin = o SQL.
          remoto="set -eu; cd /opt/macuxi; IFS= read -r MACUXI_LEITURA_VERIFICADOR; export MACUXI_LEITURA_VERIFICADOR; exec $PGCLIENTE"
          set +e
          cat "$RUNNER_TEMP/verificador" "$RUNNER_TEMP/login.sql" | ssh -l "$USUARIO" prod "$remoto" 2>&1 | tee "$RUNNER_TEMP/login.txt"
          status=${PIPESTATUS[1]}
          set -e
          {
            echo
            echo "### LOGIN temporário (saída $status)"
            echo '```'
            cat "$RUNNER_TEMP/login.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: consulta só leitura na VM
        timeout-minutes: 4
        env:
          USUARIO: ${{ secrets.PROD_USER }}
        run: |
          # Na VM (sh POSIX): 1ª linha do stdin = senha temporária (vai para o ambiente, nunca para o argv); o resto = o SQL.
          remoto=$(cat <<'REMOTO'
          set -eu
          cd /opt/macuxi
          IFS= read -r PGPASSWORD; export PGPASSWORD
          host="$(sed -n 's/^MACUXI_PG_HOST=//p' banco.env)"
          porta="$(sed -n 's/^MACUXI_PG_PORTA=//p' banco.env)"
          ssl="$(sed -n 's/^MACUXI_PG_SSL_LIBPQ=//p' imagens.env 2>/dev/null || true)"
          [ -n "$host" ] || { echo "banco.env sem MACUXI_PG_HOST" >&2; exit 8; }
          certs=""; if [ -d certs ]; then certs="-v $(pwd)/certs:/certs:ro"; fi
          exec docker run --rm -i $certs \
            -e PGHOST="$host" -e PGPORT="${porta:-5432}" -e PGDATABASE=macuxi -e PGUSER=macuxi_leitura -e PGPASSWORD \
            -e PGSSLMODE="${ssl:-require}" -e PGSSLROOTCERT=/certs/dbaas-ca.pem -e PGCONNECT_TIMEOUT=10 \
            -e PGAPPNAME=macuxi-diagnostico-outbox -e TZ=UTC \
            -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=15s' \
            pgvector/pgvector:pg16 psql -X -f -
          REMOTO
          )
          set +e
          cat "$RUNNER_TEMP/senha" "$RUNNER_TEMP/consulta.sql" | ssh -l "$USUARIO" prod "$remoto" 2>&1 | tee "$RUNNER_TEMP/saida.txt"
          status=${PIPESTATUS[1]}
          set -e
          {
            echo
            echo '```'
            cat "$RUNNER_TEMP/saida.txt"
            echo '```'
            echo "saída: $status (0 ok · 2 sem conexão · 3 erro no SQL, ex. sem LOGIN, sem grant ou trava · 8 VM sem banco.env · 255 falha do SSH)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: desligar o LOGIN do macuxi_leitura
        if: ${{ always() && steps.login.outcome != '' && steps.login.outcome != 'skipped' }}
        env:
          USUARIO: ${{ secrets.PROD_USER }}
        run: |
          cat > "$RUNNER_TEMP/nologin.sql" <<'SQL'
          \set ON_ERROR_STOP on
          \set QUIET on
          \set VERBOSITY terse
          alter role macuxi_leitura nologin password null;
          select has_table_privilege('pg_catalog.pg_authid', 'select') as le_authid \gset
          \if :le_authid
          select (select rolpassword is null from pg_authid where rolname = 'macuxi_leitura') as sem_senha \gset
          \else
          \set sem_senha '-'
          \endif
          select (not rolcanlogin and :'sem_senha' <> 'f') as desligado,
                 case when rolcanlogin then 'LOGIN ainda ligado' else 'NOLOGIN' end || ', ' ||
                 case :'sem_senha' when 't' then 'sem senha' when 'f' then 'senha ainda gravada'
                      else 'senha não conferida (o admin não lê o pg_authid)' end as resultado
            from pg_roles where rolname = 'macuxi_leitura' \gset
          \echo macuxi_leitura: :resultado
          \if :desligado
          \else
          do $$ begin raise exception 'macuxi_leitura não ficou desligado'; end $$;
          \endif
          SQL
          remoto="set -eu; cd /opt/macuxi; exec $PGCLIENTE"
          set +e
          ssh -l "$USUARIO" prod "$remoto" < "$RUNNER_TEMP/nologin.sql" 2>&1 | tee "$RUNNER_TEMP/nologin.txt"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo
            echo "### Desligar o LOGIN (saída $status)"
            echo '```'
            cat "$RUNNER_TEMP/nologin.txt"
            echo '```'
            if [ "$status" != 0 ]; then
              echo "**NOLOGIN não confirmado:** rode o workflow de novo, ou rode na VM, pelo pgcliente, \`alter role macuxi_leitura nologin password null;\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: limpar o runner
        if: ${{ always() }}
        run: |
          rm -f ~/.ssh/prod ~/.ssh/config ~/.ssh/known_hosts
          cd "$RUNNER_TEMP" && rm -f senha verificador scram.mjs login.sql login.txt consulta.sql saida.txt nologin.sql nologin.txt
