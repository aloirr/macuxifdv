name: conector — montar, assinar e publicar o pacote

# T-0098 (ADR 0037; pedido R-20261110-132536-modulo-integracao). SÓ MANUAL (workflow_dispatch): monta o
# conector-<versão>.zip (apps/conector/scripts/pacote.mjs: conector.mjs, node.exe e WinSW com SHA-256 fixo, exemplos,
# LEIA-ME), assina (.sig RSA-SHA256) e publica no bucket privado da produção pelo
# `pnpm --filter api publicar-pacote conector <zip> --versao <versão>` (pacote primeiro, ultimo.json depois). O portal
# (T-0098) libera o download quando o ultimo.json aponta para o pacote novo.
#
# Falha fechada: versão do input diferente da do apps/conector/package.json, versão fora do X.Y.Z, chave de assinatura
# ausente ou .sig não gerado = nada é publicado.
#
# Segredos (o dono do produto cria; nenhum valor vai a log, argumento de processo ou artefato):
#   CONECTOR_ASSINATURA_CHAVE_PEM  secret do REPOSITÓRIO: a chave privada RSA 3072 (PEM) da assinatura do pacote. Chega ao
#                                  pacote.mjs só pela variável MACUXI_ASSINATURA_CHAVE_PEM do passo.
#   PROD_S3_KEY_ID / PROD_S3_SECRET  já existem no environment PRODUCAO (bucket macuxi-prod; aprovação do Alexandre).
# Endpoint, região e bucket são os mesmos do scripts/deploy/producao/compose.yml. A demo (bucket macuxi-demo-arquivos)
# foi desligada em 14/11/2026 (ADR 0051): o input `ambiente` saiu.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: versão do Conector (igual ao apps/conector/package.json, ex. 1.5.0)
        required: true
        default: '1.5.0'
      simular:
        description: só montar e assinar (não grava no bucket)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conector-publicar
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publicar:
    name: pacote do Conector ${{ inputs.versao }} (producao)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: PRODUCAO
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: conferir a versão e a chave (antes de instalar qualquer coisa)
        env:
          VERSAO: ${{ inputs.versao }}
          CHAVE: ${{ secrets.CONECTOR_ASSINATURA_CHAVE_PEM }}
        run: |
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versão inválida: use X.Y.Z"; exit 1
          fi
          NO_PACOTE=$(node -p "require('./apps/conector/package.json').version")
          if [ "$VERSAO" != "$NO_PACOTE" ]; then
            echo "::error::a versão do input ($VERSAO) difere do apps/conector/package.json ($NO_PACOTE)"; exit 1
          fi
          if [ -z "$CHAVE" ]; then
            echo "::error::falta o secret CONECTOR_ASSINATURA_CHAVE_PEM: o pacote não sai sem assinatura"; exit 1
          fi

      - uses: ./.github/actions/preparar

      - name: build do Conector
        run: pnpm --filter @macuxi/conector build

      - name: montar e assinar o pacote
        env:
          MACUXI_ASSINATURA_CHAVE_PEM: ${{ secrets.CONECTOR_ASSINATURA_CHAVE_PEM }}
        run: pnpm --filter @macuxi/conector pacote

      - name: conferir zip, .sha256 e .sig
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          D=apps/conector/dist/pacote
          for f in "conector-$VERSAO.zip" "conector-$VERSAO.zip.sha256" "conector-$VERSAO.zip.sig"; do
            if [ ! -s "$D/$f" ]; then echo "::error::$D/$f não foi gerado"; ls -la "$D" || true; exit 1; fi
          done
          SHA=$(sha256sum "$D/conector-$VERSAO.zip" | cut -d' ' -f1)
          if ! grep -qi "$SHA" "$D/conector-$VERSAO.zip.sha256"; then echo "::error::o .sha256 não confere com o zip"; exit 1; fi
          echo "conector-$VERSAO.zip  sha256 $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: publicar no bucket (macuxi-prod)
        env:
          VERSAO: ${{ inputs.versao }}
          SIMULAR: ${{ inputs.simular }}
          MACUXI_ARQUIVOS_DRIVER: s3
          MACUXI_S3_ENDPOINT: https://br-se1.magaluobjects.com
          MACUXI_S3_REGIAO: br-se1
          MACUXI_S3_BUCKET: macuxi-prod
          MACUXI_S3_PREFIXO: arquivos/
          MACUXI_PACOTES_PREFIXO: pacotes/
          MACUXI_S3_CHAVE_ID: ${{ secrets.PROD_S3_KEY_ID }}
          MACUXI_S3_SEGREDO: ${{ secrets.PROD_S3_SECRET }}
        run: |
          ZIP="$GITHUB_WORKSPACE/apps/conector/dist/pacote/conector-$VERSAO.zip"
          EXTRA=()
          if [ "$SIMULAR" = "true" ]; then EXTRA=(--simular); fi
          # a CLI imprime uma linha JSON (produto, versão, arquivo, tamanho, sha256); nunca credencial nem URL assinada
          pnpm --filter api publicar-pacote conector "$ZIP" --versao "$VERSAO" "${EXTRA[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: anexar zip, .sha256 e .sig
        uses: actions/upload-artifact@v4
        with:
          name: conector-${{ inputs.versao }}
          path: |
            apps/conector/dist/pacote/conector-${{ inputs.versao }}.zip
            apps/conector/dist/pacote/conector-${{ inputs.versao }}.zip.sha256
            apps/conector/dist/pacote/conector-${{ inputs.versao }}.zip.sig
          if-no-files-found: error
          retention-days: 30
