name: preparar
description: >-
  Node 24 (.nvmrc) + pnpm com cache do store + pnpm install --frozen-lockfile e, se pedido, restaura o cache
  local do Turborepo (.turbo/cache) do job (T-0033, ADR 0013).

inputs:
  cache-turbo:
    description: 'Nome do cache do turbo deste job (ex.: lint, typecheck, testes-demais). Vazio = sem cache do turbo.'
    required: false
    default: ''
  cache-turbo-extra:
    description: 'Até 2 nomes de cache (separados por espaço) a restaurar ANTES do próprio, por prefixo (ex.: o grupo único do PR lê os 2 grupos do main). O turbo guarda por hash de conteúdo, então os caches se somam.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        # Node 24 (mín. 24.7: engines do package.json; crypto.argon2 e node:sqlite). Fonte única: .nvmrc.
        node-version-file: .nvmrc
        cache: pnpm

    - name: instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile

    # Chave por job + lockfile + commit; restaura pelo prefixo (o mais recente do mesmo job). PR lê o cache do main
    # e o do próprio PR (escopo de branch do GitHub); o main nunca lê cache de PR. No push ao main NÃO restaura:
    # o TURBO_FORCE do workflow roda tudo e o cache salvo no fim sai só com o resultado dessa execução.
    - name: nomes extras do cache do turbo
      id: extra
      if: inputs.cache-turbo != '' && github.event_name != 'push'
      shell: bash
      env:
        EXTRA: ${{ inputs.cache-turbo-extra }}
      run: |
        read -r e1 e2 _ <<< "$EXTRA" || true
        echo "e1=$e1" >> "$GITHUB_OUTPUT"
        echo "e2=$e2" >> "$GITHUB_OUTPUT"

    - name: restaurar cache do turbo (extra 1)
      if: steps.extra.outputs.e1 != ''
      uses: actions/cache/restore@v4
      with:
        path: .turbo/cache
        key: turbo-v1-${{ steps.extra.outputs.e1 }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-v1-${{ steps.extra.outputs.e1 }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-v1-${{ steps.extra.outputs.e1 }}-

    - name: restaurar cache do turbo (extra 2)
      if: steps.extra.outputs.e2 != ''
      uses: actions/cache/restore@v4
      with:
        path: .turbo/cache
        key: turbo-v1-${{ steps.extra.outputs.e2 }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-v1-${{ steps.extra.outputs.e2 }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-v1-${{ steps.extra.outputs.e2 }}-

    - name: restaurar cache do turbo
      if: inputs.cache-turbo != '' && github.event_name != 'push'
      uses: actions/cache/restore@v4
      with:
        path: .turbo/cache
        key: turbo-v1-${{ inputs.cache-turbo }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-v1-${{ inputs.cache-turbo }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-v1-${{ inputs.cache-turbo }}-
