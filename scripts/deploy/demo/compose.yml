# Ambiente demo/homologação na Magalu Cloud (T-0074, ADR 0020). Roda na VM macuxi-demo-se1 em /opt/macuxi/compose.yml
# (copiado pelo workflow de deploy). Arquivos ao lado, todos fora do git, todos modo 600:
#   .env           segredos GERADOS NA VM pelo preparar-vm.sh (senhas do Postgres, JWT, pepper do Hub). Também é o
#                  arquivo de interpolação do compose (${MACUXI_PG_ADMIN_SENHA} abaixo).
#   segredos.env   S3 (DEMO_S3_KEY_ID/DEMO_S3_SECRET → MACUXI_S3_CHAVE_ID/MACUXI_S3_SEGREDO), gravado pelo workflow.
#   tunel.env      TUNNEL_TOKEN (DEMO_CLOUDFLARE_TUNNEL_TOKEN), gravado pelo workflow; só o cloudflared lê.
#   imagens.env    MACUXI_TAG (sha publicado) e COMPOSE_PROFILES, gravado pelo workflow.
#
# Os nomes "api" (8100) e "bko" (3100) são os das rotas do túnel macuxi-demo-nuvem (painel da Cloudflare):
#   api-demo.macuxifdv.com.br → http://api:8100 · bko-demo.macuxifdv.com.br → http://bko:3100
# Nenhuma porta abre para a internet: o grupo de segurança só libera a 22 e o túnel é conexão de SAÍDA. As portas em
# 127.0.0.1 servem só para conferência por SSH (curl na própria VM).
#
# Comandos (na VM, em /opt/macuxi):
#   docker compose --env-file .env --env-file imagens.env up -d
#   docker compose --env-file .env --env-file imagens.env run --rm banco migrar up
#   docker compose --env-file .env --env-file imagens.env run --rm seed-demo --recriar
name: macuxi-demo

x-imagem-api: &imagem-api
  image: ${MACUXI_IMAGEM_API:-ghcr.io/aloirr/macuxi-api}:${MACUXI_TAG:-main}
  env_file:
    - path: .env
    - path: segredos.env
      required: false
  restart: unless-stopped

x-ambiente-api: &ambiente-api
  NODE_ENV: production
  TZ: UTC
  MACUXI_PG_HOST: postgres
  MACUXI_PG_PORTA: '5432'
  MACUXI_PG_BANCO: macuxi
  MACUXI_API_LOG: info
  # fotos (ADR 0010 + complemento na 0020): Object Storage da Magalu (br-se1). Chave e segredo vêm do segredos.env.
  MACUXI_ARQUIVOS_DRIVER: s3
  MACUXI_S3_ENDPOINT: https://br-se1.magaluobjects.com
  MACUXI_S3_REGIAO: br-se1
  MACUXI_S3_BUCKET: macuxi-demo-arquivos
  MACUXI_S3_PREFIXO: arquivos/
  # usado só se MACUXI_ARQUIVOS_DRIVER=disco (plano B: volume local)
  MACUXI_ARQUIVOS_DIR: /dados/arquivos

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MACUXI_PG_ADMIN_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${MACUXI_PG_ADMIN_SENHA:?rode o preparar-vm.sh (gera /opt/macuxi/.env)}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - log_min_duration_statement=300
      # servidor fora do PC: sem parâmetro de consulta no log (docs/banco/README.md, "Logs do Postgres")
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      interna:
        # "macuxi-postgres" é o nome que o @macuxi/db reconhece como Postgres de contêiner local (HOSTS_LOCAIS): só o
        # serviço seed-demo usa, para a base de DEMONSTRAÇÃO (dados fictícios). API, worker e migrações usam "postgres"
        # com NODE_ENV=production (falha fechada: senha pública recusada). Ver ADR 0020 §5.
        aliases: [macuxi-postgres]
    healthcheck:
      # por TCP (-h 127.0.0.1): no 1º boot o initdb sobe um servidor temporário só no socket, e o pg_isready pelo socket
      # dava "healthy" antes do servidor de verdade (a migração caía em timeout)
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256mb

  api:
    <<: *imagem-api
    environment:
      <<: *ambiente-api
      MACUXI_API_HOST: 0.0.0.0
      MACUXI_API_PORTA: '8100'
      # o cloudflared fala com a API pela rede do compose (faixa privada): o IP real do cliente vem no X-Forwarded-For
      MACUXI_TRUST_PROXY: uniquelocal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8100:8100'
    volumes:
      - arquivos:/dados/arquivos
    networks: [interna, borda]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8100/v1/saude').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      # tsx transpila os módulos na subida: em máquina carregada passa de 1 min
      start_period: 180s

  worker:
    <<: *imagem-api
    command: ['node', '--import', 'tsx', 'apps/api/src/worker.ts']
    environment:
      <<: *ambiente-api
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna, borda]

  # Imagem do engenheiro-apps (apps/web/Dockerfile). Perfil "bko": o workflow liga (COMPOSE_PROFILES=bko em
  # imagens.env) quando a imagem existe no GHCR; sem ela, o resto sobe do mesmo jeito.
  bko:
    image: ${MACUXI_IMAGEM_BKO:-ghcr.io/aloirr/macuxi-bko}:${MACUXI_TAG_BKO:-main}
    profiles: [bko]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'
      MACUXI_BKO_ORIGEM: https://bko-demo.macuxifdv.com.br
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:3100'
    networks: [borda]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    env_file: [tunel.env]
    depends_on:
      api:
        condition: service_healthy
    networks: [borda]

  # ---------- comandos avulsos (docker compose run --rm ...) ----------
  # Migrações e papéis: admin do Postgres, NODE_ENV=production.
  banco:
    <<: *imagem-api
    profiles: [ferramentas]
    restart: 'no'
    entrypoint: ['node', '--import', 'tsx', 'db/scripts/banco.ts']
    environment:
      <<: *ambiente-api
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Base de demonstração (tenant "demo", dados fictícios): "seed-demo" ou "seed-demo --recriar".
  seed-demo:
    <<: *imagem-api
    profiles: [ferramentas]
    restart: 'no'
    entrypoint: ['node', '--import', 'tsx', 'db/scripts/banco.ts', 'seed', 'demo']
    environment:
      <<: *ambiente-api
      NODE_ENV: development
      MACUXI_PG_HOST: macuxi-postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

networks:
  # sem saída para a internet: só o Postgres e quem fala com ele
  interna:
    internal: true
  # saída para a internet (túnel, Object Storage)
  borda: {}

volumes:
  pgdata:
  arquivos:
