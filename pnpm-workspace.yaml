# Expo/React Native funciona melhor com node_modules "achatado" no monorepo (herdado da Fase M).
nodeLinker: hoisted

# Agentes em paralelo: `pnpm run`/`--filter` só AVISA se o node_modules estiver fora do lockfile, não instala sozinho
# (a instalação automática do pnpm 11+ apagava pacotes enquanto outro agente regenerava o lockfile). Instale com `pnpm install`.
verifyDepsBeforeRun: warn

# Segurança da cadeia de suprimentos: não instala versões publicadas há menos de 24 h (em minutos).
minimumReleaseAge: 1440

packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"
  - "db"

# pnpm 11+: dependências autorizadas a rodar script de instalação
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@tailwindcss/oxide": true
  # oracledb em modo thin (JS puro): o install.js só verifica binários do modo thick; não roda.
  oracledb: false

# pnpm 10 (equivalente)
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"

# ADR 0023 (T-0008): o drizzle-orm do @macuxi/db (servidor) declara expo-sqlite como peer OPCIONAL, e o pnpm liga o peer
# opcional à versão que existir em qualquer ponto do grafo do workspace. Com o expo-sqlite no apps/mobile, o drizzle
# passaria a levar expo-sqlite -> expo -> react-native para a API. "-" retira só esse peer do drizzle; o app segue com o
# expo-sqlite dele. Driver novo do drizzle no servidor é peer dele (pg hoje) e não precisa mexer aqui.
overrides:
  "drizzle-orm>expo-sqlite": "-"
