<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Logo do cliente · login</title>
<link rel="stylesheet" href="logo-cliente.css">
<!--
  Simulação da spec docs/design/telas/logo-cliente.md §4 (placa única 52/36, MC-0067). Uso: login.html?v=campo|gestao.
  PNG (Playwright, deviceScaleFactor 2): login-campo.png e login-gestao.png.
  Empresa e logo FICTÍCIAS: "Distribuidora Exemplo Norte", logo-ficticia-exemplo-norte.svg, código AM4821, Lucas.
-->
<style>
  .fx{background:var(--noite);padding:0 24px 26px;flex:none}
  .fx .st{padding:0;margin:0 -4px 22px}
  .fx img{height:44px;display:block}
  .form{flex:1;padding:24px 20px 16px;display:flex;flex-direction:column;gap:14px}
  /* placa única (MC-0067): 52 × até 176, logo 36 × até 152; a mesma do fim do Mais */
  .form .placa{align-self:flex-start;height:52px;max-width:176px;padding:8px 12px;border:1px solid var(--line)}
  .form .placa img{height:36px;max-width:152px}
  .form h1{font:800 28px/34px Archivo,sans-serif}
  .cp{display:flex;flex-direction:column;gap:4px}
  .cp label{font-size:13px;font-weight:600}
  .ent{height:52px;border:1px solid var(--forte);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:16px;justify-content:space-between}
  .ent .olho{font-size:12px;font-weight:600;color:var(--noite)}
  .btn{height:52px;border-radius:12px;background:var(--noite);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center}
  .esq{height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--noite)}
  .pe{margin-top:auto;text-align:center;font-size:12px;line-height:16px;color:var(--ink2)}
  .pe a{color:var(--noite);font-weight:600;text-decoration:underline}
</style>
</head>
<body>
<div class="board" id="board"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'campo';
const A = '../../../marca/ativos/2026-11-12-v1/';
const nome = v === 'campo' ? 'Macuxi Campo' : 'Macuxi Gestão';
const st = '<div class="st"><span>06:30</span><span>4G ▮▮▮ 90%</span></div>';
const LOGO_CLI = 'logo-ficticia-exemplo-norte.svg';
function login(comLogo) {
  return `<div class="phone"><div class="fx">${st.replace('class="st"', 'class="st" style="color:#fff"')}<img src="${A}macuxi-logo-negativo-azul-noite.svg" alt="Macuxi Força de Vendas"></div>
    <div class="form">
      ${comLogo ? `<span class="placa"><img src="${LOGO_CLI}" alt="Logo da Exemplo Norte"></span>` : ''}
      <h1>Entrar</h1>
      <div class="cp"><label>Código da empresa</label><div class="ent">${comLogo ? 'AM4821' : ''}</div></div>
      <div class="cp"><label>E-mail</label><div class="ent">${comLogo ? 'lucas@exemplo.com.br' : ''}</div></div>
      <div class="cp"><label>Senha</label><div class="ent"><span></span><span class="olho">Mostrar</span></div></div>
      <div class="btn">Entrar</div>
      <div class="esq">Esqueci a senha</div>
      <div class="pe">© 2026 · Todos os direitos reservados<br>Versão 1.0.9 · <a>macuxifdv.com.br</a></div>
    </div></div>`;
}
const telas = [
  ['Entrar, sem logo', login(false)],
  ['Entrar, com logo', login(true)],
];
document.getElementById('board').innerHTML = telas.map(([l, h]) => `<div class="tela"><div class="leg">${nome} · ${l}</div>${h}</div>`).join('');
</script>
</body>
</html>
