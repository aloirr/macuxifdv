<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Logo do cliente · carga</title>
<link rel="stylesheet" href="logo-cliente.css">
<!--
  Simulação da spec docs/design/telas/logo-cliente.md §3 (MC-0066). Uso: carga.html?v=campo|gestao.
  PNG (Playwright, deviceScaleFactor 2): carga-campo.png e carga-gestao.png.
  Com logo: a logo do cliente ao lado do logo Macuxi (124 dp).
  Empresa e logo FICTÍCIAS: "Distribuidora Exemplo Norte", logo-ficticia-exemplo-norte.svg, código AM4821, Lucas.
-->
<style>
  .entrada{flex:1;display:flex;flex-direction:column;align-items:center}
  .entrada .meio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-top:20px}
  /* Carga com logo (MC-0066): ao lado, placa 64 × até 112, logo 48 × até 96, filete 1 × 64 a 24 dp de cada lado */
  .par{display:flex;align-items:center}
  .par .div{width:1px;height:64px;margin:0 24px;flex:none}
  .placa.carga{height:64px;max-width:112px;padding:8px}
  .placa.carga img{height:48px;max-width:96px}
  .ola{font-size:15px}
  .baixo{width:100%;padding:0 32px 36px;display:flex;flex-direction:column;gap:10px;min-height:250px;justify-content:flex-end}
  .linha{display:flex;justify-content:space-between;font-size:13px}
  .linha b{font-weight:700}
  .trilho{height:6px;border-radius:3px;overflow:hidden}
  .trilho i{display:block;height:100%;border-radius:3px}
  .et{display:flex;align-items:center;gap:10px;font-size:14px;height:32px}
  .bola{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="board" id="board"></div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get('v') || 'campo';
const A = '../../../marca/ativos/2026-11-12-v1/';
const campo = v === 'campo';
const T = campo
  ? { fundo:'#1E3350', texto:'#FFFFFF', claro:'#C9CED5', trilho:'#3A4D68', preench:'#F59A52', feita:'#7FD1A8', div:'#3A4D68', logo:A+'macuxi-logo-empilhado-negativo.svg', placaBorda:'none', classe:'escuro', nome:'Macuxi Campo',
      etapas:['Envio do que ficou no aparelho','Clientes e rota','Catálogo e preços','Pedidos e metas','Fotos e materiais'] }
  : { fundo:'#F8F6F1', texto:'#1E3350', claro:'#4A5562', trilho:'#DFE2E6', preench:'#C2540A', feita:'#1D6B4F', div:'#DFE2E6', logo:A+'macuxi-logo-empilhado-positivo.svg', placaBorda:'1px solid #DFE2E6', classe:'', nome:'Macuxi Gestão',
      etapas:['Envio do que ficou no aparelho','Equipe','Aprovações','Metas','Alertas'] };
const st = '<div class="st"><span>06:30</span><span>4G ▮▮▮ 90%</span></div>';
const LOGO_CLI = 'logo-ficticia-exemplo-norte.svg';

function marca(comLogo) {
  const m = `<img src="${T.logo}" alt="Macuxi Força de Vendas" style="width:${comLogo ? 124 : 170}px;display:block">`;
  if (!comLogo) return m;
  const placa = `<span class="placa carga" style="border:${T.placaBorda}"><img src="${LOGO_CLI}" alt="Logo da Exemplo Norte"></span>`;
  return `<div class="par">${m}<span class="div" style="background:${T.div}"></span>${placa}</div>`;
}
function etapas() {
  return T.etapas.map((e, i) => {
    if (i < 1) return `<div class="et" style="color:${T.texto}"><span class="bola" style="background:${T.feita};color:${campo ? '#1E3350' : '#fff'}">✓</span>${e}</div>`;
    if (i === 1) return `<div class="et" style="color:${T.texto};font-weight:600"><span class="bola" style="border:2px solid ${T.preench}"><i style="width:8px;height:8px;border-radius:50%;background:${T.preench}"></i></span>${e}</div>`;
    return `<div class="et" style="color:${T.claro}"><span class="bola" style="border:2px solid ${T.trilho}"></span>${e}</div>`;
  }).join('');
}
function carga(comLogo) {
  // As duas telas no mesmo momento (depois do login): a única diferença é a logo do cliente.
  const baixo = `<div class="linha" style="color:${T.texto}"><span>Etapa 2 de 5 · ${T.etapas[1]}</span><b>38%</b></div>
       <div class="trilho" style="background:${T.trilho}"><i style="width:38%;background:${T.preench}"></i></div>${etapas()}`;
  return `<div class="phone ${T.classe}" style="background:${T.fundo}">${st}
    <div class="entrada"><div class="meio">${marca(comLogo)}<div class="ola" style="color:${T.claro}">Olá, Lucas</div></div>
    <div class="baixo">${baixo}</div></div></div>`;
}
const telas = [
  ['Carga, sem logo', carga(false)],
  ['Carga, com logo', carga(true)],
];
document.getElementById('board').innerHTML = telas.map(([l, h]) => `<div class="tela"><div class="leg">${T.nome} · ${l}</div>${h}</div>`).join('');
</script>
</body>
</html>
