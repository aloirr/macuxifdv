// ---------- índice de veículos (o domínio faria; aqui só para a simulação) ----------
const todasApps = () => PRODUTOS.flatMap((p) => p.apps);
const cobreAno = (a, ano) => a.de != null && ano >= a.de && ano <= a.ate;
function opcoes(nivel, v) {
  let apps = todasApps();
  if (v.mont) apps = apps.filter((a) => a.mont === v.mont);
  if (v.modelo) apps = apps.filter((a) => a.modelo === v.modelo);
  if (nivel === 'mont') return [...new Set(apps.map((a) => a.mont))].sort();
  if (nivel === 'modelo') return [...new Set(apps.map((a) => a.modelo))].sort((x, y) => x.localeCompare(y));
  if (nivel === 'ano') { const s = new Set(); apps.forEach((a) => { if (a.de != null) for (let y = a.de; y <= a.ate; y++) s.add(y); }); return [...s].sort((x, y) => y - x); }
  apps = apps.filter((a) => cobreAno(a, v.ano));
  if (nivel === 'motor') return [...new Set(apps.flatMap((a) => a.motores))].sort();
  if (v.motor) apps = apps.filter((a) => !a.motores.length || a.motores.includes(v.motor));
  return [...new Set(apps.flatMap((a) => a.versoes))].sort();
}
function proximoNivelAntes(v, depois, ate) {
  for (let i = NIVEIS.indexOf(depois) + 1; i < NIVEIS.indexOf(ate); i++) if (opcoes(NIVEIS[i], v).length >= 2 && v[NIVEIS[i]] == null) return true;
  return false;
}
function proximoNivel(v, depois) {
  for (let i = NIVEIS.indexOf(depois) + 1; i < NIVEIS.length; i++) { const n = NIVEIS[i]; if (v[n] == null && opcoes(n, v).length >= 2) return n; }
  return null;
}
// passa no filtro ou não (D4, spec §5): só restringe o que foi escolhido (o nível preenchido sozinho conta como escolhido);
// o escolhido exige o dado no trecho: ano dentro da faixa (sem ano, não passa); motor e versão citados e iguais (D6 e D7, §15)
function compat(p, v) {
  if (!v) return null;
  for (const a of p.apps) {
    if (a.mont !== v.mont || a.modelo !== v.modelo) continue;
    if (v.ano != null && !cobreAno(a, v.ano)) continue;
    if (v.motor && !a.motores.includes(v.motor)) continue;
    if (v.versao && !a.versoes.includes(v.versao)) continue;
    return 'ok';
  }
  return null;
}
const nomeVeic = (v) => [v.modelo, v.ano, v.motor, v.versao].filter(Boolean).join(' ');
const brl = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const sem = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function trechoNegrito(ap, v) {
  if (!v) return esc(ap);
  const re = new RegExp('(' + v.modelo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^·]*)', 'i');
  return esc(ap).replace(re, '<b>$1</b>');
}

function folhaFiltrar() {

const app = document.getElementById('app');

  app.innerHTML = h; S.av = false;
  if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }

function aplicar(v) {
  setVeic(v); S.folha = null;
  const k = JSON.stringify(v); S.recentes = [v, ...S.recentes.filter((r) => JSON.stringify(r) !== k)].slice(0, 3);
  S.carregando = true; render(); setTimeout(() => { S.carregando = false; render(); }, 600);
}
function avancar(depois) {
  // nível com uma opção só é preenchido sozinho (aparece na trilha sem toque); sem opção, pulado
  for (let i = NIVEIS.indexOf(depois) + 1; i < NIVEIS.length; i++) { const n = NIVEIS[i]; const o = opcoes(n, S.rasc); if (o.length !== 1) continue; if (n === 'modelo' || n === 'ano' || n === 'motor' || n === 'versao') { if (proximoNivelAntes(S.rasc, depois, n)) break; S.rasc[n] = o[0]; S.auto.add(n); } }

  if (prox) { S.nivel = prox; S.av = true; render(); const r = document.getElementById('rot-nivel'); if (r) r.focus({ preventScroll: true }); }
  else aplicar({ ...S.rasc });
}
app.addEventListener('input', (e) => {

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a, d = el.dataset;
  if (a === 'abrir-veiculo') { const v = veicAtual(); S.rasc = v ? { ...v } : {}; S.bf = ''; S.nivel = v ? (['versao', 'motor', 'ano'].find((k) => v[k] != null) || 'ano') : 'mont'; S.folha = 'veiculo'; }
  else if (a === 'abrir-filtrar') S.folha = 'filtrar';
  else if (a === 'fechar-folha') S.folha = null;
  else if (a === 'tirar-veiculo') setVeic(null);
  else if (a === 'recente') return aplicar({ ...S.recentes[+d.i] });
  else if (a === 'esc-mont') { S.auto = new Set(); S.rasc = { mont: d.v }; S.bf = ''; return avancar('mont'); }
  else if (a === 'esc-modelo-busca') { S.auto = new Set(); S.rasc = { mont: d.m, modelo: d.v }; S.bf = ''; return avancar('modelo'); }
  else if (a === 'esc') { const n = S.nivel; const val = n === 'ano' ? +d.v : d.v; const r = {}; for (const k of NIVEIS) { if (k === n) break; if (S.rasc[k] != null) r[k] = S.rasc[k]; } r[n] = val; S.rasc = r; S.auto = new Set([...S.auto].filter((k) => NIVEIS.indexOf(k) < NIVEIS.indexOf(n))); return avancar(n); }
  else if (a === 'nivel') { S.auto = new Set([...S.auto].filter((k) => NIVEIS.indexOf(k) < NIVEIS.indexOf(d.n))); S.nivel = d.n; const r = {}; for (const k of NIVEIS) { if (k === d.n) break; if (S.rasc[k] != null) r[k] = S.rasc[k]; } S.rasc = r; }
  else if (a === 'ver-pecas') return aplicar(Object.fromEntries(Object.entries(S.rasc).filter(([k, v]) => v != null && NIVEIS.indexOf(k) < NIVEIS.indexOf(S.nivel))));
  else if (a === 'chip') { const s = S.chips[d.g] || (S.chips[d.g] = new Set()); s.has(d.v) ? s.delete(d.v) : s.add(d.v); }
  else if (a === 'tirar-chip') S.chips[d.g].delete(d.v);
  else if (a === 'limpar-chips') S.chips = {};
  else if (a === 'limpar-busca') { if (S.tela === 'pedido') S.qp = ''; else S.q = ''; }
  else if (a === 'so-estoque') S.soEst = !S.soEst;
  else if (a === 'ficha') { if (S.tela !== 'ficha') S.voltaDe = S.tela; S.ficha = d.id; S.tela = 'ficha'; app.scrollTop = 0; }
  else if (a === 'voltar') S.tela = S.voltaDe;
  else if (a === 'ir-vitrine') S.tela = 'vitrine';
  render();
});
document.querySelectorAll('[data-ctl]').forEach((b) => b.addEventListener('click', () => {
  const c = b.dataset.ctl;
  if (c === 'reset') S = INICIAL(); else if (c === 'sinal') S.sinal = !S.sinal; else { S.tela = c; S.folha = null; }
  render();
}));

// ---------- estados prontos para os prints (?estado=) ----------
const GOL = { mont:'Volkswagen', modelo:'Gol', ano:2018, motor:'1.0' };
const ESTADOS = {
  'vitrine': () => {},
  'folha-montadora': () => { S.folha = 'veiculo'; S.nivel = 'mont'; },
  'folha-busca': () => { S.folha = 'veiculo'; S.nivel = 'mont'; S.bf = 'gol'; },
  'folha-ano': () => { S.folha = 'veiculo'; S.rasc = { mont:'Volkswagen', modelo:'Gol' }; S.nivel = 'ano'; },
  'folha-motor': () => { S.folha = 'veiculo'; S.rasc = { mont:'Volkswagen', modelo:'Gol', ano:2018 }; S.nivel = 'motor'; },
  'folha-versao': () => { S.folha = 'veiculo'; S.rasc = { ...GOL }; S.nivel = 'versao'; },
  'vitrine-veiculo': () => { S.veic = { ...GOL }; },
  'filtrar-contagem': () => { S.veic = { ...GOL }; S.chips = { sis: new Set(['Suspensão']) }; S.folha = 'filtrar'; },
  'ficha': () => { S.veic = { ...GOL }; S.tela = 'ficha'; S.ficha = 'p1'; S.voltaDe = 'vitrine'; },
  'sem-resultado': () => { S.veic = { ...GOL }; S.q = 'traseiro'; },
  'sem-resultado-filtro': () => { S.veic = { ...GOL }; S.chips = { sis: new Set(['Elétrica']) }; },
  'sem-sinal': () => { S.veic = { ...GOL }; S.sinal = false; },
  'carregando': () => { S.veic = { ...GOL }; S.carregando = true; },
  'pedido': () => { S.tela = 'pedido'; S.pedidoVeic = { ...GOL }; },
};
const prm = new URLSearchParams(location.search);
if (prm.has('estado') && ESTADOS[prm.get('estado')]) { ESTADOS[prm.get('estado')](); document.body.classList.add('print'); }
render();
</script>
